<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hegel Encyclopedia — 3D</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600&display=swap');

  :root {
    --bg: #060a0f;
    --line: #00e5ff;
    --line-dim: #007a8a;
    --accent: #ffb300;
    --text: #c8e6f0;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    overflow: hidden;
  }
  #canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #labels-overlay { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 8; }

  .hud { position: absolute; pointer-events: none; z-index: 10; }
  #breadcrumb {
    top: 24px; left: 50%; transform: translateX(-50%);
    font-size: 0.68rem; letter-spacing: 0.2em;
    color: var(--line-dim); text-transform: uppercase;
    text-align: center; white-space: nowrap;
    max-width: 90vw; overflow: hidden; text-overflow: ellipsis;
  }
  #breadcrumb .current { color: var(--accent); }
  #floor-indicator {
    top: 24px; right: 24px;
    font-size: 0.65rem; letter-spacing: 0.18em;
    color: var(--accent); text-transform: uppercase;
  }
  #nav-buttons {
    right: 24px; top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 0.6rem;
    pointer-events: auto;
  }
  #nav-buttons button {
    background: rgba(8, 18, 28, 0.85);
    border: 1px solid var(--line-dim);
    color: var(--line);
    font-family: inherit; font-size: 1rem;
    padding: 0.7rem 1rem; cursor: pointer;
    transition: all 0.2s; min-width: 46px;
  }
  #nav-buttons button:hover:not(:disabled) {
    background: rgba(0, 229, 255, 0.12);
    border-color: var(--line); color: var(--accent);
  }
  #nav-buttons button:disabled { opacity: 0.25; cursor: default; }

  #status-line {
    bottom: 20px; left: 20px;
    font-size: 0.6rem; letter-spacing: 0.14em;
    color: var(--line-dim); text-transform: uppercase;
  }
  #status-line .accent { color: var(--accent); }

  .corner {
    position: absolute; width: 42px; height: 42px;
    border-color: var(--line-dim); border-style: solid;
    pointer-events: none; z-index: 5;
  }
  .corner.tl { top: 16px; left: 16px; border-width: 1px 0 0 1px; }
  .corner.tr { top: 16px; right: 16px; border-width: 1px 1px 0 0; }
  .corner.bl { bottom: 16px; left: 16px; border-width: 0 0 1px 1px; }
  .corner.br { bottom: 16px; right: 16px; border-width: 0 1px 1px 0; }

  #loading {
    position: absolute; inset: 0; display: flex;
    align-items: center; justify-content: center;
    font-size: 0.75rem; letter-spacing: 0.2em;
    color: var(--accent); text-transform: uppercase;
    z-index: 50; background: var(--bg);
  }
</style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="labels-overlay"></div>

  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <div id="breadcrumb" class="hud"></div>
  <div id="floor-indicator" class="hud"></div>

  <div id="nav-buttons" class="hud">
    <button id="up-btn" title="Up (↑)">▲</button>
    <button id="down-btn" title="Down (↓)">▼</button>
  </div>

  <div id="status-line" class="hud">
    HEGEL // <span class="accent">ENCYCLOPEDIA</span> // 1830
  </div>

  <div id="loading">Loading encyclopedia.json…</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

/* ============================================================
   CONFIG
   ============================================================ */
const FLOOR_HEIGHT  = 200;
const MAJOR_R       = 20;
const MINOR_R       = 12;
const MINOR_DIST    = 32;
const CAM_OFFSET    = new THREE.Vector3(0, 240, 260);
const VISIBLE_RANGE = 3;   // how many floors above/below keep meshes visible
const LABEL_RANGE   = 1;   // how many floors above/below keep labels

/* ============================================================
   STATE
   ============================================================ */
let encyclopediaData = null;
const nodeByKey      = {};   // key -> entry
const floors         = [];   // floorIdx -> { index, nodes, y, opacity, targetOpacity }
let activeFloorIdx   = 0;
let focusedEntry     = null;

/* ============================================================
   THREE.JS SETUP
   ============================================================ */
const canvas   = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x060a0f, 1);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x060a0f);
scene.fog = new THREE.Fog(0x060a0f, 1200, 5000);

const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 12000);

/* ============================================================
   TREE PROCESSING
   ============================================================ */
function processTree(root) {
  // Assign unique path-based keys since id_ values are not unique.
  function walk(node, depth, parentKey, indexPath) {
    const key = indexPath.length === 0 ? 'root' : 'n' + indexPath.join('-');
    const children = Array.isArray(node.children) ? node.children : [];
    const hasChildren = children.length > 0;

    const entry = {
      node, key, depth, parentKey,
      hasChildren,
      childKeys: [],
      floorIdx: hasChildren ? depth : null,
      x: 0, z: 0,
      center: null,
      group: null,
      major: null,
      minors: []
    };
    nodeByKey[key] = entry;

    children.forEach((child, i) => {
      const childKey = walk(child, depth + 1, key, [...indexPath, i]);
      entry.childKeys.push(childKey);
    });
    return key;
  }
  walk(root, 0, null, []);
}

function computeFloors() {
  const allEntries = Object.values(nodeByKey);
  const maxDepth = allEntries.reduce((m, e) => Math.max(m, e.depth), 0);

  for (let d = 0; d <= maxDepth; d++) {
    floors[d] = {
      index: d,
      nodes: [],
      y: (maxDepth - d) * FLOOR_HEIGHT,  // deepest = y 0, shallowest = top
      opacity: 1,
      targetOpacity: 1
    };
  }

  allEntries.forEach(entry => {
    if (entry.hasChildren) {
      floors[entry.depth].nodes.push(entry);
    }
  });

  // Drop any empty floors (should be rare but keep robust)
  for (let i = floors.length - 1; i >= 0; i--) {
    if (!floors[i] || floors[i].nodes.length === 0) floors.splice(i, 1);
  }
  floors.forEach((floor, i) => {
    floor.index = i;
    floor.nodes.forEach(entry => { entry.floorIdx = i; });
  });

  console.log(`Tree: ${allEntries.length} total nodes, ${floors.length} floors, ` +
              `floor sizes: [${floors.map(f => f.nodes.length).join(', ')}]`);
}

/* ============================================================
   GEOMETRY
   ============================================================ */
function triangleGeometry(R, orientation) {
  const shape = new THREE.Shape();
  shape.moveTo(0, R);
  shape.lineTo(-R * Math.sqrt(3) / 2, -R / 2);
  shape.lineTo( R * Math.sqrt(3) / 2, -R / 2);
  shape.closePath();
  const geo = new THREE.ShapeGeometry(shape);
  geo.rotateX(-Math.PI / 2);
  if (orientation === 'down') geo.rotateY(Math.PI);
  return geo;
}

function makeTriangle(R, fillColor, strokeColor, fillOpacity, strokeOpacity, orientation) {
  const geo = triangleGeometry(R, orientation);
  const fillMat = new THREE.MeshBasicMaterial({
    color: fillColor, transparent: true, opacity: fillOpacity,
    side: THREE.DoubleSide, depthWrite: false
  });
  const fill = new THREE.Mesh(geo, fillMat);
  const edges = new THREE.EdgesGeometry(geo);
  const lineMat = new THREE.LineBasicMaterial({
    color: strokeColor, transparent: true, opacity: strokeOpacity,
    depthWrite: false
  });
  const line = new THREE.LineSegments(edges, lineMat);
  const group = new THREE.Group();
  group.add(fill, line);
  return { group, fill, line, fillMat, lineMat };
}

/* ============================================================
   FLOOR LAYOUT
   ============================================================ */
function floorLayout(n) {
  let cols;
  if (n <= 1) cols = 1;
  else if (n <= 3) cols = n;
  else if (n <= 4) cols = 2;
  else if (n <= 9) cols = 3;
  else if (n <= 16) cols = 4;
  else if (n <= 30) cols = 6;
  else cols = Math.ceil(Math.sqrt(n * 1.5));
  const rows = Math.ceil(n / cols);
  return { cols, rows };
}

function floorSpacing(n) {
  if (n <= 3)  return 150;
  if (n <= 9)  return 120;
  if (n <= 20) return 95;
  if (n <= 40) return 75;
  if (n <= 80) return 60;
  return 45;
}

function gridPosition(i, layout, spacing) {
  const row = Math.floor(i / layout.cols);
  const col = i % layout.cols;
  return {
    x: (col - (layout.cols - 1) / 2) * spacing,
    z: (row - (layout.rows - 1) / 2) * spacing
  };
}

function minorPositions(count, dist) {
  if (count === 0) return [];
  if (count === 1) return [{ x: 0, z: -dist }];
  if (count === 2) return [
    { x: -dist * 0.87, z: -dist * 0.5 },
    { x:  dist * 0.87, z: -dist * 0.5 }
  ];
  // 3+ children: standard N / SW / SE for the first three;
  // extra (should not occur in this dataset) distributed in a circle.
  const base = [
    { x: 0,             z: -dist },
    { x: -dist * 0.87,  z:  dist * 0.5 },
    { x:  dist * 0.87,  z:  dist * 0.5 }
  ];
  if (count <= 3) return base.slice(0, count);
  const out = [];
  for (let i = 0; i < count; i++) {
    const a = (Math.PI * 2 * i) / count - Math.PI / 2;
    out.push({ x: Math.cos(a) * dist, z: Math.sin(a) * dist });
  }
  return out;
}

/* ============================================================
   BUILD
   ============================================================ */
const clickableFills = [];

function buildTriangleGroup(entry, pos, y, scale) {
  const group = new THREE.Group();
  group.position.set(pos.x, y, pos.z);

  const majorR    = MAJOR_R * scale;
  const minorR    = MINOR_R * scale;
  const minorDist = MINOR_DIST * scale;

  const major = makeTriangle(majorR, 0xffb300, 0xffb300, 0.10, 0.9, 'down');
  major.fill.userData = { kind: 'major', entry };
  clickableFills.push(major.fill);
  group.add(major.group);

  const childCount = entry.childKeys.length;
  const mpos = minorPositions(childCount, minorDist);

  entry.childKeys.forEach((childKey, i) => {
    const mp = mpos[i];
    if (!mp) return;
    const minor = makeTriangle(minorR, 0x00e5ff, 0x00e5ff, 0.06, 0.85, 'up');
    minor.group.position.set(mp.x, 0.02, mp.z);
    minor.fill.userData = { kind: 'minor', entry, childKey };
    clickableFills.push(minor.fill);
    group.add(minor.group);
    entry.minors.push({ mesh: minor, childKey, offset: mp });
  });

  entry.group = group;
  entry.major = major;
  entry.center = new THREE.Vector3(pos.x, y, pos.z);
  entry.x = pos.x;
  entry.z = pos.z;
  scene.add(group);
}

function buildAllFloors() {
  floors.forEach(floor => {
    if (!floor || floor.nodes.length === 0) return;
    const n = floor.nodes.length;
    const layout = floorLayout(n);
    const spacing = floorSpacing(n);
    const scale = Math.min(1, spacing / 130);

    floor.nodes.forEach((entry, i) => {
      const pos = gridPosition(i, layout, spacing);
      buildTriangleGroup(entry, pos, floor.y, scale);
    });
  });
  console.log(`Built ${clickableFills.length} clickable meshes`);
}

/* ============================================================
   CAMERA / FOCUS
   ============================================================ */
const camTargetPos  = new THREE.Vector3();
const camTargetLook = new THREE.Vector3();
const camCurLook    = new THREE.Vector3();

function focusOn(entry, immediate = false) {
  if (!entry) return;
  focusedEntry = entry;
  activeFloorIdx = entry.floorIdx;

  camTargetLook.copy(entry.center);
  camTargetPos.copy(entry.center).add(CAM_OFFSET);

  updateFloorOpacities();
  updateVisibility();
  updateHud();
  rebuildLabels();

  if (immediate) {
    camera.position.copy(camTargetPos);
    camCurLook.copy(camTargetLook);
    camera.lookAt(camCurLook);
  }
}

function updateFloorOpacities() {
  floors.forEach((floor, i) => {
    const d = Math.abs(i - activeFloorIdx);
    if (d === 0)      floor.targetOpacity = 1;
    else if (d === 1) floor.targetOpacity = 0.4;
    else if (d === 2) floor.targetOpacity = 0.15;
    else if (d === 3) floor.targetOpacity = 0.05;
    else              floor.targetOpacity = 0;
  });
}

function updateVisibility() {
  floors.forEach((floor, i) => {
    const visible = Math.abs(i - activeFloorIdx) <= VISIBLE_RANGE;
    floor.nodes.forEach(entry => {
      if (entry.group) entry.group.visible = visible;
    });
  });
}

/* ============================================================
   HUD
   ============================================================ */
function updateHud() {
  const breadcrumb = document.getElementById('breadcrumb');
  const indicator  = document.getElementById('floor-indicator');
  const upBtn      = document.getElementById('up-btn');
  const downBtn    = document.getElementById('down-btn');

  if (!focusedEntry) {
    breadcrumb.innerHTML = '<span class="current">OVERVIEW</span>';
    indicator.textContent = '';
    upBtn.disabled = true;
    downBtn.disabled = floors.length === 0;
    return;
  }

  const path = [];
  let e = focusedEntry;
  while (e) {
    path.unshift(e);
    e = e.parentKey ? nodeByKey[e.parentKey] : null;
  }
  breadcrumb.innerHTML = path
    .map((e, i) => i === path.length - 1
      ? `<span class="current">${e.node.name}</span>`
      : e.node.name)
    .join(' / ');

  indicator.textContent = `FLOOR ${activeFloorIdx + 1} / ${floors.length}`;

  upBtn.disabled = !focusedEntry.parentKey;
  downBtn.disabled = !focusedEntry.childKeys.some(ck => nodeByKey[ck].hasChildren);
}

/* ============================================================
   NAVIGATION
   ============================================================ */
function goUp() {
  if (!focusedEntry || !focusedEntry.parentKey) return;
  const parent = nodeByKey[focusedEntry.parentKey];
  if (parent && parent.hasChildren) focusOn(parent);
}

function goDown() {
  if (!focusedEntry) {
    if (floors[0] && floors[0].nodes[0]) focusOn(floors[0].nodes[0]);
    return;
  }
  const childKey = focusedEntry.childKeys.find(ck => nodeByKey[ck].hasChildren);
  if (childKey) focusOn(nodeByKey[childKey]);
}

function handleTriangleClick(mesh) {
  const d = mesh.userData;
  if (d.kind === 'major') {
    focusOn(d.entry);
  } else if (d.kind === 'minor') {
    const child = nodeByKey[d.childKey];
    if (child.hasChildren) focusOn(child);
    else focusOn(d.entry);  // leaf: focus the parent group
  }
}

/* ============================================================
   LABELS
   ============================================================ */
const labelsOverlay = document.getElementById('labels-overlay');
let labelSet = [];

function clearLabels() {
  labelSet.forEach(l => l.el.remove());
  labelSet = [];
}

function addLabel(text, x, y, z, color, size, weight) {
  if (labelSet.length >= 260) return;
  const el = document.createElement('div');
  const t = String(text || '');
  el.textContent = t.length > 28 ? t.slice(0, 26) + '…' : t;
  el.style.cssText = `
    position:absolute; left:0; top:0;
    color:${color};
    font-family:'JetBrains Mono', monospace;
    font-size:${size};
    font-weight:${weight};
    letter-spacing:0.04em;
    text-transform:uppercase;
    transform:translate(-50%,-50%);
    pointer-events:none;
    white-space:nowrap;
    text-shadow:0 0 8px rgba(0,0,0,0.95), 0 0 3px rgba(0,0,0,1);
    will-change:transform, opacity;
    opacity:0;
  `;
  labelsOverlay.appendChild(el);
  labelSet.push({ el, worldPos: new THREE.Vector3(x, y, z) });
}

function rebuildLabels() {
  clearLabels();
  if (!focusedEntry) return;

  const activeFloor = floors[activeFloorIdx];
  if (!activeFloor) return;

  // Active floor: all majors + all minors (capped naturally by addLabel)
  for (const entry of activeFloor.nodes) {
    addLabel(entry.node.name, entry.center.x, entry.center.y + 6, entry.center.z,
             '#ffb300', '0.72rem', 600);
  }
  for (const entry of activeFloor.nodes) {
    for (const m of entry.minors) {
      const child = nodeByKey[m.childKey];
      addLabel(child.node.name,
               entry.x + m.offset.x, entry.center.y + 6, entry.z + m.offset.z,
               '#c8e6f0', '0.55rem', 400);
    }
  }

  // Adjacent floors: majors only, capped
  for (const delta of [-1, 1]) {
    const fi = activeFloorIdx + delta;
    if (fi < 0 || fi >= floors.length) continue;
    const floor = floors[fi];
    const cap = Math.min(20, floor.nodes.length);
    for (let i = 0; i < cap; i++) {
      const e = floor.nodes[i];
      addLabel(e.node.name, e.center.x, e.center.y + 6, e.center.z,
               '#ffb300', '0.55rem', 400);
    }
  }
}

/* ============================================================
   ANIMATION
   ============================================================ */
const tempVec = new THREE.Vector3();

function updateLabels() {
  const w = innerWidth, h = innerHeight;
  for (const l of labelSet) {
    tempVec.copy(l.worldPos).project(camera);
    if (tempVec.z > 1) { l.el.style.opacity = '0'; continue; }
    const x = (tempVec.x * 0.5 + 0.5) * w;
    const y = (-tempVec.y * 0.5 + 0.5) * h;
    if (x < -120 || x > w + 120 || y < -60 || y > h + 60) {
      l.el.style.opacity = '0';
      continue;
    }
    l.el.style.opacity = '1';
    l.el.style.transform = `translate(${x}px, ${y}px) translate(-50%, -50%)`;
  }
}

function updateFloorVisuals(dt) {
  const lerp = 1 - Math.pow(0.005, dt);
  floors.forEach((floor, i) => {
    floor.opacity += (floor.targetOpacity - floor.opacity) * lerp;
    const vis = Math.abs(i - activeFloorIdx) <= VISIBLE_RANGE;
    if (!vis) return;
    floor.nodes.forEach(entry => {
      if (entry.major) {
        entry.major.fillMat.opacity = 0.10 * floor.opacity;
        entry.major.lineMat.opacity = 0.90 * floor.opacity;
      }
      entry.minors.forEach(m => {
        m.mesh.fillMat.opacity = 0.06 * floor.opacity;
        m.mesh.lineMat.opacity = 0.85 * floor.opacity;
      });
    });
  });
}

/* ============================================================
   RAYCASTING
   ============================================================ */
const raycaster = new THREE.Raycaster();
const pointer   = new THREE.Vector2(-2, -2);
let hoveredMesh = null;

canvas.addEventListener('pointermove', e => {
  const r = canvas.getBoundingClientRect();
  pointer.x = ((e.clientX - r.left) / r.width) * 2 - 1;
  pointer.y = -((e.clientY - r.top) / r.height) * 2 + 1;
  raycastHover();
});

canvas.addEventListener('click', () => {
  if (hoveredMesh) handleTriangleClick(hoveredMesh);
});

function raycastHover() {
  // Build a filtered list of meshes on currently visible floors.
  const candidates = [];
  for (const floor of floors) {
    if (Math.abs(floor.index - activeFloorIdx) > VISIBLE_RANGE) continue;
    if (floor.opacity < 0.03) continue;
    for (const entry of floor.nodes) {
      if (entry.major) candidates.push(entry.major.fill);
      for (const m of entry.minors) candidates.push(m.mesh.fill);
    }
  }
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(candidates, false);
  const newHover = hits.length > 0 ? hits[0].object : null;

  if (newHover !== hoveredMesh) {
    if (hoveredMesh) {
      const d = hoveredMesh.userData;
      hoveredMesh.material.color.setHex(d.kind === 'major' ? 0xffb300 : 0x00e5ff);
    }
    hoveredMesh = newHover;
    if (hoveredMesh) {
      const d = hoveredMesh.userData;
      hoveredMesh.material.color.setHex(d.kind === 'major' ? 0xffd966 : 0x99f0ff);
    }
    canvas.style.cursor = hoveredMesh ? 'pointer' : 'default';
  }
}

/* ============================================================
   MAIN LOOP
   ============================================================ */
let lastTime = performance.now();

function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = Math.min(0.1, (now - lastTime) / 1000);
  lastTime = now;

  const camLerp = 1 - Math.pow(0.005, dt);
  camera.position.lerp(camTargetPos, camLerp);
  camCurLook.lerp(camTargetLook, camLerp);
  camera.lookAt(camCurLook);

  updateFloorVisuals(dt);
  updateLabels();
  renderer.render(scene, camera);
}

/* ============================================================
   RESIZE
   ============================================================ */
function onResize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', onResize);

/* ============================================================
   INIT
   ============================================================ */
async function init() {
  const loading = document.getElementById('loading');
  try {
    const res = await fetch('encyclopedia.json', { cache: 'no-cache' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    encyclopediaData = await res.json();
  } catch (e) {
    loading.textContent = 'Failed to load encyclopedia.json — ' + e.message;
    return;
  }
  loading.style.display = 'none';

  processTree(encyclopediaData);
  computeFloors();
  buildAllFloors();

  // Start at the root (System) — highest floor
  const rootEntry = nodeByKey['root'];
  if (rootEntry) focusOn(rootEntry, true);

  onResize();
  animate();
}

document.getElementById('up-btn').addEventListener('click', goUp);
document.getElementById('down-btn').addEventListener('click', goDown);
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowUp')   { e.preventDefault(); goUp(); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); goDown(); }
});

init();
</script>
</body>
</html>
