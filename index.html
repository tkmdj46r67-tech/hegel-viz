<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Hegel's Encyclopedia — Hyperbolic Browser</title>
<style>
  :root {
    color-scheme: dark;
    --pw: clamp(320px, 34vw, 430px);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    overflow: hidden; overscroll-behavior: none;
    background: #080a0f;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: grab; }
  canvas.grabbing { cursor: grabbing; }

  #ui { position: fixed; inset: 0; pointer-events: none; z-index: 10; }

  .panel {
    background: rgba(14, 18, 26, 0.82);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.35);
  }

  #top {
    position: absolute; top: 12px; left: 12px; right: 12px;
    display: flex; gap: 10px; align-items: flex-start;
    justify-content: space-between;
    transition: right .35s cubic-bezier(.22,.9,.3,1);
  }
  body.panel-open #top { right: calc(var(--pw) + 24px); }

  #searchWrap { position: relative; pointer-events: auto; flex: 0 1 auto; min-width: 0; }
  #search {
    width: 236px; max-width: 100%; padding: 9px 12px; border-radius: 12px; outline: none;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(14,18,26,0.82);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    color: #e6edf5; font-size: 13px; font-family: inherit;
  }
  #search:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.15); }
  #results {
    position: absolute; top: calc(100% + 6px); left: 0; width: 360px;
    max-height: 340px; overflow-y: auto; display: none; padding: 4px;
  }
  #results .r { padding: 7px 10px; font-size: 12.5px; color: #d4e0ec; cursor: pointer; border-radius: 8px; }
  #results .r:hover { background: rgba(255,255,255,0.08); }
  #results .r .p { color: #5f7288; font-size: 10.5px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #results .empty { padding: 10px; color: #5f7288; font-size: 12px; }

  .iconbtn {
    pointer-events: auto; flex: 0 0 auto;
    width: 38px; height: 38px;
    display: grid; place-items: center;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(14,18,26,0.82);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    color: #a8bccf; cursor: pointer; transition: background .15s, color .15s;
  }
  .iconbtn:hover { background: rgba(255,255,255,0.09); color: #fff; }
  .iconbtn svg { width: 17px; height: 17px; display: block; }

  #hint {
    position: absolute; bottom: 12px; left: 12px;
    padding: 9px 14px; font-size: 11.5px; color: #7d8ea3; line-height: 1.65;
    transition: opacity .25s;
  }
  #hint b { color: #a8bccf; font-weight: 600; }

  #legend {
    position: absolute; bottom: 12px; right: 12px;
    padding: 9px 14px; font-size: 12px; display: flex; gap: 16px; align-items: center;
    transition: right .35s cubic-bezier(.22,.9,.3,1), opacity .25s;
  }
  body.panel-open #legend { right: calc(var(--pw) + 24px); }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 7px; vertical-align: middle; }

  #tip {
    position: absolute; padding: 7px 11px; font-size: 12px; color: #e6edf5;
    max-width: 340px; display: none; pointer-events: none;
    background: rgba(8,12,18,0.96);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 9px; line-height: 1.5;
    box-shadow: 0 10px 30px rgba(0,0,0,.5);
    z-index: 5;
  }
  #tip .p { color: #5f7288; font-size: 10.5px; margin-bottom: 3px; }

  #panel {
    position: fixed;
    top: 12px; right: 12px; bottom: 12px;
    width: var(--pw);
    display: flex; flex-direction: column;
    background: rgba(13, 17, 24, 0.9);
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.55);
    transform: translateX(calc(100% + 24px));
    transition: transform .38s cubic-bezier(.22,.9,.3,1);
    pointer-events: none;
    z-index: 30;
    overflow: hidden;
  }
  #panel.open { transform: none; pointer-events: auto; }

  .p-head {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 16px 16px 13px 18px;
    border-bottom: 1px solid rgba(255,255,255,0.07);
    flex: 0 0 auto;
  }
  .p-titles { min-width: 0; flex: 1 1 auto; }
  .p-kicker {
    font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase;
    color: #6d84a0; font-weight: 600; margin-bottom: 4px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .p-head h2 {
    margin: 0; font-size: 17.5px; line-height: 1.3; font-weight: 650;
    color: #f2f6fb; letter-spacing: -0.01em; word-break: break-word;
  }
  .p-close {
    flex: 0 0 auto;
    width: 30px; height: 30px; border-radius: 9px;
    border: 1px solid rgba(255,255,255,0.09);
    background: rgba(255,255,255,0.04);
    color: #93a8c0; cursor: pointer; font-size: 13px;
    display: grid; place-items: center; transition: background .15s, color .15s;
  }
  .p-close:hover { background: rgba(255,255,255,0.11); color: #fff; }

  .p-body {
    flex: 1 1 auto; overflow-y: auto; padding: 16px 18px 20px;
    scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.14) transparent;
  }
  .p-body::-webkit-scrollbar { width: 8px; }
  .p-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,.13); border-radius: 4px; }

  .p-sec { margin-bottom: 20px; }
  .p-sec:last-child { margin-bottom: 0; }
  .p-label {
    font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase;
    color: #5f7288; font-weight: 600; margin-bottom: 9px;
  }

  .mini { width: 100%; }
  .mini svg { display: block; }

  .para { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .para .pnum {
    font-size: 26px; font-weight: 650; color: #ffe9a8; letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums; line-height: 1.1;
  }
  .sect {
    margin-top: 7px; font-size: 12.5px; color: #b9c9db; line-height: 1.55;
  }
  .inherit {
    margin-top: 7px; font-size: 11.5px; color: #6d84a0; line-height: 1.55;
    padding-left: 10px; border-left: 2px solid rgba(255,255,255,0.09);
  }

  .p-path { font-size: 12.5px; color: #93a8c0; line-height: 1.75; word-break: break-word; }
  .p-path .psep { color: #3d4c60; padding: 0 5px; }
  .p-path .pcur { color: #e6edf5; font-weight: 600; }

  .p-foot {
    flex: 0 0 auto; padding: 10px 18px 13px;
    font-size: 10.5px; color: #4e6076; line-height: 1.55;
    border-top: 1px solid rgba(255,255,255,0.06);
  }

  #err {
    position: absolute; inset: 0; display: none; place-items: center;
    padding: 40px; text-align: center; color: #8fa3ba; font-size: 14px; line-height: 1.8;
  }
  #err code { background: rgba(255,255,255,.08); padding: 2px 6px; border-radius: 5px; color: #cfe0f0; }

  @media (max-width: 859px) {
    #panel {
      top: auto; right: 8px; left: 8px; bottom: 8px;
      width: auto; height: min(62vh, 560px);
      transform: translateY(calc(100% + 24px));
      border-radius: 16px;
    }
    body.panel-open #top { right: 12px; }
    body.panel-open #legend { right: 12px; opacity: 0; pointer-events: none; }
    body.panel-open #hint { opacity: 0; pointer-events: none; }
    #results { width: min(360px, calc(100vw - 32px)); }
    #search { width: 190px; }
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="ui">
  <div id="top">
    <div id="searchWrap">

      <div id="results" class="panel"></div>
    </div>
    <button id="fsBtn" class="iconbtn" title="Toggle fullscreen" aria-label="Toggle fullscreen">

        <path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M3 16v3a2 2 0 0 0 2 2h3"/>
      </svg>
    </button>
  </div>

  <div id="hint" class="panel">
    <b>Click</b> a node to zoom in &amp; open details &nbsp;·&nbsp; <b>click background</b> / <b>Esc</b> to close<br/>
    <b>Scroll</b> to zoom &nbsp;·&nbsp; <b>Drag</b> to pan
  </div>

  <div id="legend" class="panel">
    <span><i class="dot" style="background:#5b9bf5"></i>Logic</span>
    <span><i class="dot" style="background:#4ec98a"></i>Nature</span>
    <span><i class="dot" style="background:#c084fc"></i>Spirit</span>
  </div>

  <div id="err"></div>
</div>

<aside id="panel" aria-hidden="true">
  <div class="p-head">
    <div class="p-titles">

    </div>

  </div>
  <div class="p-body">
    <section class="p-sec">
      <div class="p-label">Local structure</div>
      <div id="miniTree" class="mini"></div>
    </section>
    <section class="p-sec">
      <div class="p-label">Encyclopedia reference</div>
      <div class="para" id="pPara"></div>
      <div class="sect" id="pSect"></div>
      <div class="inherit" id="pInherit" style="display:none"></div>
    </section>
    <section class="p-sec">
      <div class="p-label">Path</div>
      <div class="p-path" id="pPath"></div>
    </section>
  </div>
  <div class="p-foot">Paragraph numbers follow the 1830 edition of the <i>Encyclopaedia of Philosophical Sciences</i> (Werke, vols. 8–10).</div>
</aside>

<script>
"use strict";

/* =========================================================
   CANVAS / DPR
   ========================================================= */
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let dpr = 1, W = 1, H = 1;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  updateViewShift();
  if (panelNode) renderMiniTree(panelNode);
  needsDraw = true;
}

/* =========================================================
   STATE
   ========================================================= */
let NODES = [];
let ROOT = null;
let MAXD = 1;

let A  = { re: 0, im: 0 };
let AT = { re: 0, im: 0 };

let ZOOM  = 1;
let ZOOMT = 1;

let PANX = 0, PANY = 0;
let PANTX = 0, PANTY = 0;

let viewShift = 0, viewShiftTarget = 0;

let FOCUS = null;
let HOVER = null;
let hoverPath = new Set();

let needsDraw = true;
let dragging = false, moved = false, dragStart = null;
let panelNode = null;

const EASE = 0.06;

let preferredZoom = 1;
let firstNodeClick = true;

const PALETTE = ["#5b9bf5", "#4ec98a", "#c084fc"];

/* =========================================================
   PARAGRAPH MAP  (1830 Encyclopaedia, Werke 8–10)
   ========================================================= */
const PARAS = {

/* =========================================================
   COMPLEX HELPERS
   ========================================================= */
function mobius(z, a) {
  const ar = a.re, ai = a.im;
  const dr = ar * z.re + ai * z.im;
  const di = ar * z.im - ai * z.re;
  const nr = z.re - ar, ni = z.im - ai;
  const denr = 1 - dr, deni = -di;
  const den = denr * denr + deni * deni;
  if (den < 1e-12) return { re: 0, im: 0 };
  return {
    re: (nr * denr + ni * deni) / den,
    im: (ni * denr - nr * deni) / den
  };
}

/* =========================================================
   LAYOUT
   ========================================================= */
function prepare(data) {
  NODES = [];
  MAXD = 0;

  (function walk(n, parent, depth) {
    n._id = NODES.length;
    n._parent = parent;
    n._depth = depth;
    n._children = n.children || [];
    if (depth > MAXD) MAXD = depth;
    NODES.push(n);
    for (let i = 0; i < n._children.length; i++) walk(n._children[i], n, depth + 1);
  })(data, null, 0);

  ROOT = data;

  (function countLeaves(n) {
    if (n._children.length === 0) { n._leaves = 1; return 1; }
    let s = 0;
    for (let i = 0; i < n._children.length; i++) s += countLeaves(n._children[i]);
    n._leaves = s;
    return s;
  })(data);

  (function assign(n, a0, a1) {
    n._ang = (a0 + a1) * 0.5;
    n._a0 = a0; n._a1 = a1;
    if (n._children.length) {
      let total = 0;
      for (let i = 0; i < n._children.length; i++) total += n._children[i]._leaves;
      let cur = a0;
      for (let i = 0; i < n._children.length; i++) {
        const c = n._children[i];
        const w = (a1 - a0) * (c._leaves / total);
        assign(c, cur, cur + w);
        cur += w;
      }
    }
  })(data, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2);

  const dr = 0.93 / Math.max(1, MAXD);
  for (let i = 0; i < NODES.length; i++) {
    const n = NODES[i];
    const r = dr * n._depth;
    n._z = { re: r * Math.cos(n._ang), im: r * Math.sin(n._ang) };
    n._w = { re: 0, im: 0 };
    n._m = 0;
    n._sx = 0; n._sy = 0;
  }

  data._color = "#cbd5e1";
  for (let i = 0; i < data._children.length; i++) {
    const col = PALETTE[i % PALETTE.length];
    (function paint(n) {
      n._color = col;
      for (let j = 0; j < n._children.length; j++) paint(n._children[j]);
    })(data._children[i]);
  }
}

/* =========================================================
   GEODESIC DRAWING
   ========================================================= */
function strokeGeo(p, q, cx0, cy0, s) {
  const px = p.re, py = p.im, qx = q.re, qy = q.im;
  const p2 = px * px + py * py;
  const q2 = qx * qx + qy * qy;
  const det = 4 * (px * qy - py * qx);

  if (Math.abs(det) < 1e-7) {
    ctx.beginPath();
    ctx.moveTo(cx0 + s * px, cy0 + s * py);
    ctx.lineTo(cx0 + s * qx, cy0 + s * qy);
    ctx.stroke();
    return;
  }

  const b1 = 1 + p2, b2 = 1 + q2;
  const cx = (b1 * 2 * qy - 2 * py * b2) / det;
  const cy = (2 * px * b2 - b1 * 2 * qx) / det;
  const R2 = cx * cx + cy * cy - 1;

  if (R2 <= 1e-9 || R2 > 25e6) {
    ctx.beginPath();
    ctx.moveTo(cx0 + s * px, cy0 + s * py);
    ctx.lineTo(cx0 + s * qx, cy0 + s * qy);
    ctx.stroke();
    return;
  }

  const R = Math.sqrt(R2);
  const tp = Math.atan2(py - cy, px - cx);
  const tq = Math.atan2(qy - cy, qx - cx);

  let d = tq - tp;
  while (d < 0) d += Math.PI * 2;
  while (d >= Math.PI * 2) d -= Math.PI * 2;

  const tm = tp + d / 2;
  const mx = cx + R * Math.cos(tm);
  const my = cy + R * Math.sin(tm);
  const inside = (mx * mx + my * my) < 1;

  ctx.beginPath();
  ctx.arc(cx0 + s * cx, cy0 + s * cy, s * R, tp, tq, !inside);
  ctx.stroke();
}

/* =========================================================
   DRAW
   ========================================================= */
function draw() {
  const cx0 = W / 2 + viewShift + PANX;
  const cy0 = H / 2 + PANY;
  const scale = Math.min(W, H) * 0.48 * ZOOM;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  const g = ctx.createRadialGradient(cx0, cy0, 0, cx0, cy0, Math.max(W, H) * 0.72);
  g.addColorStop(0, "rgba(38, 54, 78, 0.5)");
  g.addColorStop(1, "rgba(8, 10, 15, 0)");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  ctx.beginPath();
  ctx.arc(cx0, cy0, scale, 0, Math.PI * 2);
  ctx.strokeStyle = "rgba(120, 152, 195, 0.15)";
  ctx.lineWidth = 1;
  ctx.stroke();

  for (let i = 0; i < NODES.length; i++) {
    const n = NODES[i];
    const z = mobius(n._z, A);
    let r2 = z.re * z.re + z.im * z.im;
    if (r2 > 0.9999995) r2 = 0.9999995;
    n._w = z;
    n._m = 1 - r2;
    n._sx = cx0 + scale * z.re;
    n._sy = cy0 + scale * z.im;
  }

  ctx.lineCap = "round";
  for (let i = 0; i < NODES.length; i++) {
    const n = NODES[i];
    const p = n._parent;
    if (!p) continue;
    const m = n._m < p._m ? n._m : p._m;
    if (m < 0.012) continue;

    const hot = hoverPath.has(n) && hoverPath.has(p);
    if (hot) {
      ctx.strokeStyle = "rgba(255, 214, 102, " + Math.min(0.95, 0.35 + m * 0.8) + ")";
      ctx.lineWidth = Math.max(0.8, Math.min(2.8, 0.9 + 2.6 * m));
    } else {
      const al = Math.min(0.55, 0.05 + m * 0.5);
      ctx.strokeStyle = "rgba(126, 158, 196, " + al + ")";
      ctx.lineWidth = Math.max(0.4, Math.min(2.0, 0.35 + 2.1 * m));
    }
    strokeGeo(p._w, n._w, cx0, cy0, scale);
  }

  for (let i = 0; i < NODES.length; i++) {
    const n = NODES[i];
    const m = n._m;
    if (m < 0.006) continue;

    const rr = Math.max(0.6, Math.min(11, 1.1 + 7.5 * m));
    const hot = hoverPath.has(n);

    ctx.beginPath();
    ctx.arc(n._sx, n._sy, hot ? rr + 2.2 : rr, 0, Math.PI * 2);

    if (hot) {
      ctx.fillStyle = "#ffd666";
      ctx.globalAlpha = 1;
    } else {
      ctx.fillStyle = n._color || "#9ab";
      ctx.globalAlpha = Math.min(1, 0.22 + m * 1.15);
    }
    ctx.fill();

    if (hot) {
      ctx.globalAlpha = 1;
      ctx.strokeStyle = "rgba(255,214,102,0.55)";
      ctx.lineWidth = 1.2;
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  if (FOCUS) {
    ctx.beginPath();
    ctx.arc(cx0, cy0, 9, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(255, 214, 102, 0.35)";
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  const cand = [];
  for (let i = 0; i < NODES.length; i++) {
    const n = NODES[i];
    if (n._m > 0.16) cand.push(n);
  }
  cand.sort((a, b) => b._m - a._m);

  const LIMIT = 80;
  for (let i = 0; i < cand.length && i < LIMIT; i++) drawLabel(cand[i], cx0, false);

  if (HOVER) {
    let x = HOVER;
    while (x) {
      if (x._m > 0.02) drawLabel(x, cx0, true);
      x = x._parent;
    }
  }
}

function drawLabel(n, cx0, force) {
  const m = n._m;
  const fs = 7.5 + 6.5 * m;
  if (!force && fs < 8.2) return;
  if (force && fs < 6) return;

  const size = Math.max(8, fs);
  ctx.font = "500 " + size.toFixed(1) + "px ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif";
  ctx.textBaseline = "middle";

  const left = n._sx < cx0;
  ctx.textAlign = left ? "right" : "left";

  const rr = Math.max(0.6, Math.min(11, 1.1 + 7.5 * m));
  const tx = n._sx + (left ? -(rr + 5) : (rr + 5));

  const maxW = 210;
  let s = n.name;
  if (ctx.measureText(s).width > maxW) {
    while (s.length > 4 && ctx.measureText(s + "…").width > maxW) s = s.slice(0, -1);
    s = s.replace(/[\s,;:.\-]+$/, "") + "…";
  }

  const a = Math.min(1, 0.18 + m * 1.25);
  ctx.fillStyle = force ? "rgba(255, 226, 150, " + a + ")" : "rgba(226, 236, 248, " + a + ")";
  ctx.fillText(s, tx, n._sy);
}

/* =========================================================
   TARGET ZOOM  (neighborhood of the node)
   ========================================================= */
function targetZoomFor(node) {
  if (!node || node === ROOT) return 1;
  const d = node._depth;
  return 3.5 + Math.min(d, 8) * 0.35;
}

/* =========================================================
   MAIN LOOP
   ========================================================= */
function loop() {
  let dirty = false;

  const dx = AT.re - A.re;
  const dy = AT.im - A.im;
  if (Math.abs(dx) > 1e-6 || Math.abs(dy) > 1e-6) {
    A.re += dx * EASE;
    A.im += dy * EASE;
    dirty = true;
  } else if (A.re !== AT.re || A.im !== AT.im) {
    A.re = AT.re;
    A.im = AT.im;
    dirty = true;
  }

  const dz = ZOOMT - ZOOM;
  if (Math.abs(dz) > 0.0008) {
    ZOOM += dz * EASE;
    dirty = true;
  } else if (ZOOM !== ZOOMT) {
    ZOOM = ZOOMT;
    dirty = true;
  }

  const dpx = PANTX - PANX;
  const dpy = PANTY - PANY;
  if (Math.abs(dpx) > 0.15 || Math.abs(dpy) > 0.15) {
    PANX += dpx * EASE;
    PANY += dpy * EASE;
    dirty = true;
  } else if (PANX !== PANTX || PANY !== PANTY) {
    PANX = PANTX;
    PANY = PANTY;
    dirty = true;
  }

  const ds = viewShiftTarget - viewShift;
  if (Math.abs(ds) > 0.15) {
    viewShift += ds * 0.16;
    dirty = true;
  } else if (viewShift !== viewShiftTarget) {
    viewShift = viewShiftTarget;
    dirty = true;
  }

  if (dirty || needsDraw) {
    draw();
    needsDraw = false;
  }
  requestAnimationFrame(loop);
}

/* =========================================================
   PANEL / PARAGRAPHS
   ========================================================= */
const panel = document.getElementById("panel");

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function paraFor(node) {
  if (node === ROOT) return { p: "1–577", note: "The Encyclopaedia as a whole" };
  let n = node;
  while (n) {
    if (n.id_ && PARAS[n.id_]) {
      const e = PARAS[n.id_];
      return { p: e.p, holder: n, exact: n === node };
    }
    n = n._parent;
  }
  return null;
}

function sectionFor(node) {
  let n = node;
  while (n) {
    if (n.id_ && PARAS[n.id_] && PARAS[n.id_].s) return PARAS[n.id_].s;
    n = n._parent;
  }
  return "Encyclopaedia";
}

function fmtParagraph(p) {
  if (!p) return "—";
  return /[–-]/.test(p) ? "§§" + p : "§" + p;
}

function updateViewShift() {
  if (panelNode && window.innerWidth >= 860) {
    const pw = panel.getBoundingClientRect().width || 400;
    viewShiftTarget = -(pw + 12) / 2;
  } else {
    viewShiftTarget = 0;
  }
}

function openPanel(node) {
  panelNode = node;
  document.body.classList.add("panel-open");
  panel.classList.add("open");
  panel.setAttribute("aria-hidden", "false");
  renderPanel(node);
  updateViewShift();
  needsDraw = true;
}

function closePanel() {
  if (!panelNode) return;
  panelNode = null;
  document.body.classList.remove("panel-open");
  panel.classList.remove("open");
  panel.setAttribute("aria-hidden", "true");
  updateViewShift();
  needsDraw = true;
}

/* ---------- measuring + mini-tree ---------- */
const measureCtx = document.createElement("canvas").getContext("2d");

function fitText(text, maxW, font) {
  measureCtx.font = font;
  if (measureCtx.measureText(text).width <= maxW) return text;
  let s = text;
  while (s.length > 1 && measureCtx.measureText(s + "…").width > maxW) s = s.slice(0, -1);
  return s.replace(/[\s,;:.\-]+$/, "") + "…";
}

function pillSVG(x, y, w, h, node, opts) {
  opts = opts || {};
  const idx = node._id;
  const color = node._color || "#9ab";
  const active = !!opts.active;
  const dim = !!opts.dim;
  const compact = !!opts.compact;

  const fill = active
    ? "rgba(255,214,102,0.10)"
    : dim
      ? "rgba(255,255,255,0.025)"
      : "rgba(255,255,255,0.05)";
  const stroke = active
    ? "rgba(255,214,102,0.72)"
    : dim
      ? "rgba(255,255,255,0.08)"
      : "rgba(255,255,255,0.12)";
  const op = dim ? 0.72 : 1;

  const fontPx = compact ? 10 : 11.5;
  const font = "500 " + fontPx + "px ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif";

  const dotX = x + (compact ? 9 : 11);
  const dotR = compact ? 2.4 : 3.2;
  const textX = x + (compact ? 17 : 21);
  const maxText = Math.max(20, w - (textX - x) - 8);
  const label = fitText(node.name, maxText, font);

  return (
    '<g data-nid="' + idx + '" opacity="' + op + '" style="cursor:pointer">' +
      '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="6"' +
        ' fill="' + fill + '" stroke="' + stroke + '" stroke-width="1"/>' +
      '<circle cx="' + dotX + '" cy="' + (y + h / 2) + '" r="' + dotR + '" fill="' + color + '"/>' +
      '<text x="' + textX + '" y="' + (y + h / 2 + 0.5) + '"' +
        ' font-family="ui-sans-serif, system-ui, -apple-system, \'Segoe UI\', Roboto, sans-serif"' +
        ' font-size="' + fontPx + '" font-weight="500"' +
        ' fill="' + (active ? "#ffe9a8" : "#dbe7f2") + '" dominant-baseline="middle">' +
        esc(label) +
      '</text>' +
    '</g>'
  );
}

function renderMiniTree(node) {
  const wrap = document.getElementById("miniTree");
  const W0 = Math.max(240, wrap.clientWidth || 340);

  const chain = [];
  let n = node;
  while (n) { chain.unshift(n); n = n._parent; }

  const kids = node._children || [];

  const ancH = 22, ancGap = 15;
  const selfH = 28, selfGap = 22;
  const kidH = 26, kidGap = 6;

  let y = 0;
  const ancRows = [];
  for (let i = 0; i < chain.length - 1; i++) {
    ancRows.push({ node: chain[i], y: y, h: ancH });
    y += ancH + ancGap;
  }
  const selfRow = { node: node, y: y, h: selfH };
  y += selfH + (kids.length ? selfGap : 0);

  const kidRows = [];
  if (kids.length) {
    for (let i = 0; i < kids.length; i++) {
      kidRows.push({ node: kids[i], y: y, h: kidH });
      y += kidH + (i < kids.length - 1 ? kidGap : 0);
    }
  }

  const H0 = Math.max(44, y + 6);
  const parts = [];
  parts.push('<svg width="' + W0 + '" height="' + H0 + '" viewBox="0 0 ' + W0 + ' ' + H0 + '" xmlns="http://www.w3.org/2000/svg">');

  const centerX = W0 / 2;

  /* ---- ancestor spine ---- */
  let prevBottom = null;
  for (const r of ancRows) {
    if (prevBottom !== null) {
      parts.push('<line x1="' + centerX + '" y1="' + prevBottom + '" x2="' + centerX + '" y2="' + r.y + '" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>');
    }
    prevBottom = r.y + r.h;
  }
  if (prevBottom !== null) {
    parts.push('<line x1="' + centerX + '" y1="' + prevBottom + '" x2="' + centerX + '" y2="' + selfRow.y + '" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>');
  }

  /* ---- self → children (vertical stack, left spine) ---- */
  if (kidRows.length) {
    const selfBottom = selfRow.y + selfRow.h;
    const spineX = 14;
    const pillX = 28;
    const pillW = W0 - pillX - 8;
    const elbowY = selfBottom + 11;
    const lastKid = kidRows[kidRows.length - 1];
    const lastCenter = lastKid.y + lastKid.h / 2;

    /* from self bottom → down → left → down the spine */
    parts.push('<line x1="' + centerX + '" y1="' + selfBottom + '" x2="' + centerX + '" y2="' + elbowY + '" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>');
    parts.push('<line x1="' + centerX + '" y1="' + elbowY + '" x2="' + spineX + '" y2="' + elbowY + '" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>');
    parts.push('<line x1="' + spineX + '" y1="' + elbowY + '" x2="' + spineX + '" y2="' + lastCenter + '" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>');

    /* horizontal connectors into each child */
    for (const kr of kidRows) {
      const cy = kr.y + kr.h / 2;
      parts.push('<line x1="' + spineX + '" y1="' + cy + '" x2="' + pillX + '" y2="' + cy + '" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>');
    }

    /* kid pills, full width */
    for (const kr of kidRows) {
      parts.push(pillSVG(pillX, kr.y, pillW, kr.h, kr.node, {}));
    }
  }

  /* ---- ancestor + self pills ---- */
  const ancW = Math.min(W0 - 60, 250);
  const ancX = centerX - ancW / 2;
  const selfW = Math.min(W0 - 8, 270);
  const selfX = centerX - selfW / 2;

  for (const r of ancRows) {
    parts.push(pillSVG(ancX, r.y, ancW, r.h, r.node, { dim: true, compact: true }));
  }
  parts.push(pillSVG(selfX, selfRow.y, selfW, selfH, node, { active: true }));

  parts.push('</svg>');
  wrap.innerHTML = parts.join("");

  wrap.querySelectorAll("[data-nid]").forEach(function (el) {
    el.addEventListener("click", function () {
      const nn = NODES[+el.getAttribute("data-nid")];
      if (nn) { focusOn(nn); openPanel(nn); }
    });
  });
}

function renderPanel(node) {
  document.getElementById("pKicker").textContent = sectionFor(node);
  document.getElementById("pTitle").textContent = node.name || "—";

  renderMiniTree(node);

  const info = paraFor(node);
  const pPara = document.getElementById("pPara");
  const pSect = document.getElementById("pSect");
  const pInherit = document.getElementById("pInherit");

  if (info) {
    pPara.innerHTML = '<span class="pnum">' + esc(fmtParagraph(info.p)) + "</span>";
    pSect.textContent = sectionFor(node);

    if (info.exact === false && info.holder) {
      pInherit.style.display = "block";
      pInherit.innerHTML =
        "Listed here as a sub-division of <b>" + esc(info.holder.name) + "</b> (" +
        esc(fmtParagraph(info.p)) + ").";
    } else if (info.note) {
      pInherit.style.display = "block";
      pInherit.textContent = info.note;
    } else {
      pInherit.style.display = "none";
    }
  } else {
    pPara.innerHTML = '<span class="pnum">—</span>';
    pSect.textContent = "";
    pInherit.style.display = "none";
  }

  const chain = [];
  let n = node;
  while (n) { chain.unshift(n); n = n._parent; }
  document.getElementById("pPath").innerHTML = chain.map(function (x, i) {
    const cls = i === chain.length - 1 ? "pcur" : "";
    return '<span class="' + cls + '">' + esc(x.name) + "</span>";
  }).join('<span class="psep">›</span>');
}

/* =========================================================
   INTERACTION
   ========================================================= */
function hitTest(mx, my) {
  let best = null, bestScore = Infinity;
  for (let i = 0; i < NODES.length; i++) {
    const n = NODES[i];
    if (n._m < 0.02) continue;
    const dx = n._sx - mx, dy = n._sy - my;
    const d2 = dx * dx + dy * dy;
    if (d2 > 196) continue;
    const score = d2 * (1.4 - Math.min(1, n._m));
    if (score < bestScore) { bestScore = score; best = n; }
  }
  return best;
}

function focusOn(n) {
  if (!n) return;
  FOCUS = n;
  AT = { re: n._z.re, im: n._z.im };
  PANTX = 0;
  PANTY = 0;

  if (n === ROOT) {
    ZOOMT = preferredZoom;
  } else if (firstNodeClick) {
    ZOOMT = Math.max(preferredZoom, targetZoomFor(n));
    preferredZoom = ZOOMT;
    firstNodeClick = false;
  } else {
    ZOOMT = preferredZoom;
  }

  needsDraw = true;
}

function setHover(n) {
  if (HOVER === n) return;
  HOVER = n;
  hoverPath = new Set();
  let x = n;
  while (x) { hoverPath.add(x); x = x._parent; }
  needsDraw = true;

  const tip = document.getElementById("tip");
  if (!n) { tip.style.display = "none"; return; }

  const parts = [];
  let y = n._parent;
  while (y) { parts.unshift(y.name); y = y._parent; }
  const path = parts.length ? parts.join(" › ") : "";

  tip.innerHTML = (path ? '<div class="p">' + esc(path) + "</div>" : "") + esc(n.name);
  tip.style.display = "block";
}

function localPos(e) {
  const r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

canvas.addEventListener("pointerdown", function (e) {
  canvas.setPointerCapture(e.pointerId);
  dragging = true;
  moved = false;
  dragStart = { x: e.clientX, y: e.clientY, px: PANX, py: PANY };
  canvas.classList.add("grabbing");
});

canvas.addEventListener("pointermove", function (e) {
  const pos = localPos(e);

  if (dragging) {
    const dx = e.clientX - dragStart.x;
    const dy = e.clientY - dragStart.y;
    if (!moved && Math.abs(dx) + Math.abs(dy) > 5) moved = true;
    if (moved) {
      PANX = dragStart.px + dx;
      PANY = dragStart.py + dy;
      PANTX = PANX;
      PANTY = PANY;
      clampPan();
      needsDraw = true;
    }
    return;
  }

  const n = hitTest(pos.x, pos.y);
  setHover(n);

  if (n) {
    const tip = document.getElementById("tip");
    tip.style.left = Math.min(W - 360, pos.x + 16) + "px";
    tip.style.top = Math.min(H - 90, pos.y + 16) + "px";
  }
});

canvas.addEventListener("pointerup", function (e) {
  canvas.classList.remove("grabbing");
  if (dragging && !moved) {
    const pos = localPos(e);
    const n = hitTest(pos.x, pos.y);
    if (n) {
      focusOn(n);
      openPanel(n);
    } else {
      if (panelNode) {
        closePanel();
      } else if (FOCUS && FOCUS._parent) {
        focusOn(FOCUS._parent);
      }
    }
  }
  dragging = false;
});

canvas.addEventListener("pointerleave", function () {
  setHover(null);
  dragging = false;
  canvas.classList.remove("grabbing");
});

canvas.addEventListener("wheel", function (e) {
  e.preventDefault();
  const pos = localPos(e);

  const factor = Math.exp(-e.deltaY * 0.0016);
  const newZoom = Math.min(12, Math.max(1, ZOOM * factor));
  if (Math.abs(newZoom - ZOOM) < 0.001) return;

  const cx = W / 2 + viewShift;
  const cy = H / 2;
  const base = Math.min(W, H) * 0.48;

  const wx = (pos.x - cx - PANX) / (base * ZOOM);
  const wy = (pos.y - cy - PANY) / (base * ZOOM);

  ZOOM = newZoom;
  ZOOMT = newZoom;
  preferredZoom = newZoom;
  PANX = pos.x - cx - base * ZOOM * wx;
  PANY = pos.y - cy - base * ZOOM * wy;
  PANTX = PANX;
  PANTY = PANY;

  clampPan();
  needsDraw = true;
}, { passive: false });

function clampPan() {
  const maxPan = Math.max(W, H) * (ZOOM - 1) * 0.55;
  PANX = Math.max(-maxPan, Math.min(maxPan, PANX));
  PANY = Math.max(-maxPan, Math.min(maxPan, PANY));
  if (ZOOM <= 1.001) { PANX = 0; PANY = 0; PANTX = 0; PANTY = 0; }
}

window.addEventListener("keydown", function (e) {
  if (e.key === "Escape" || e.key === "Backspace") {
    if (panelNode) {
      e.preventDefault();
      closePanel();
    } else if (FOCUS && FOCUS._parent) {
      e.preventDefault();
      focusOn(FOCUS._parent);
    }
  }
});

/* =========================================================
   SEARCH
   ========================================================= */
const searchEl = document.getElementById("search");
const resultsEl = document.getElementById("results");

searchEl.addEventListener("input", function () {
  const q = searchEl.value.trim().toLowerCase();
  if (q.length < 2) { resultsEl.style.display = "none"; return; }

  const hits = [];
  for (let i = 0; i < NODES.length && hits.length < 60; i++) {
    const n = NODES[i];
    if (n.name && n.name.toLowerCase().indexOf(q) !== -1) hits.push(n);
  }

  resultsEl.innerHTML = "";
  if (!hits.length) {
    resultsEl.innerHTML = '<div class="empty">No matches</div>';
    resultsEl.style.display = "block";
    return;
  }

  hits.forEach(function (n) {
    const d = document.createElement("div");
    d.className = "r";
    const parts = [];
    let y = n._parent;
    while (y) { parts.unshift(y.name); y = y._parent; }
    d.innerHTML =
      "<div>" + esc(n.name) + "</div>" +
      '<div class="p">' + esc(parts.join(" › ")) + "</div>";
    d.onclick = function () {
      focusOn(n);
      openPanel(n);
      resultsEl.style.display = "none";
      searchEl.value = "";
      searchEl.blur();
    };
    resultsEl.appendChild(d);
  });
  resultsEl.style.display = "block";
});

document.addEventListener("click", function (e) {
  if (!document.getElementById("searchWrap").contains(e.target)) {
    resultsEl.style.display = "none";
  }
});

/* =========================================================
   FULLSCREEN + PANEL CONTROLS
   ========================================================= */
document.getElementById("fsBtn").addEventListener("click", function () {
  if (!document.fullscreenElement) {
    const p = document.documentElement.requestFullscreen
      ? document.documentElement.requestFullscreen()
      : Promise.reject();
    if (p && p.catch) p.catch(function () {});
  } else {
    document.exitFullscreen().catch(function () {});
  }
});

document.getElementById("pClose").addEventListener("click", closePanel);

window.addEventListener("resize", function () {
  updateViewShift();
  if (panelNode) renderMiniTree(panelNode);
  needsDraw = true;
});

/* =========================================================
   BOOT
   ========================================================= */
async function boot() {
  resize();
  window.addEventListener("resize", resize);

  let data;
  try {
    const res = await fetch("tree.json", { cache: "no-cache" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    data = await res.json();
  } catch (err) {
    const box = document.getElementById("err");
    box.style.display = "grid";
    box.innerHTML =
      "<div><b>Could not load <code>tree.json</code></b><br/><br/>" +
      "Make sure the JSON file sits next to <code>index.html</code> " +
      "and that you are serving the folder (GitHub Pages does this automatically).<br/><br/>" +
      '<span style="color:#5f7288;font-size:12px">' + esc(err.message) + "</span></div>";
    return;
  }

  prepare(data);

  FOCUS = data;
  A = { re: data._z.re, im: data._z.im };
  AT = { re: data._z.re, im: data._z.im };
  ZOOM = 1;
  ZOOMT = 1;
  preferredZoom = 1;
  PANX = PANY = PANTX = PANTY = 0;

  updateViewShift();

  needsDraw = true;
  requestAnimationFrame(loop);
}

boot();
</script>
</body>
</html>
