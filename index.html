<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hegel Triadic Navigator — Floors</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600&display=swap');

  :root {
    --bg: #060a0f;
    --line: #00e5ff;
    --line-dim: #007a8a;
    --accent: #ffb300;
    --text: #c8e6f0;
    --panel-bg: rgba(8, 18, 28, 0.96);
    --panel-border: #00e5ff44;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: radial-gradient(circle at 50% 40%, #0a1a28 0%, var(--bg) 70%);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    overflow: hidden;
  }

  #app {
    display: flex;
    height: 100vh;
    width: 100vw;
    position: relative;
  }

  #stage-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  /* HUD corner brackets */
  #stage-wrap::before,
  #stage-wrap::after {
    content: '';
    position: absolute;
    width: 42px;
    height: 42px;
    border-color: var(--line-dim);
    border-style: solid;
    pointer-events: none;
    z-index: 5;
  }
  #stage-wrap::before {
    top: 16px; left: 16px;
    border-width: 1px 0 0 1px;
  }
  #stage-wrap::after {
    bottom: 16px; right: 16px;
    border-width: 0 1px 1px 0;
  }

  #stage {
    position: absolute;
    inset: 0;
    overflow: hidden;
  }

  .floor {
    position: absolute;
    left: 0;
    top: 0;
    transform-origin: center center;
    transition:
      transform 0.7s cubic-bezier(0.22, 1, 0.36, 1),
      opacity 0.7s ease,
      filter 0.7s ease;
    will-change: transform, opacity;
  }

  .floor.inactive {
    cursor: pointer;
  }

  /* --- SVG triangles --- */
  .tri-major polygon {
    fill: rgba(255, 179, 0, 0.05);
    stroke: var(--accent);
    stroke-width: 1.5;
    transition: fill 0.2s, stroke-width 0.2s;
  }
  .tri-major:hover polygon {
    fill: rgba(255, 179, 0, 0.18);
    stroke-width: 2.2;
    filter: drop-shadow(0 0 10px var(--accent));
  }
  .tri-major text {
    fill: var(--accent);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    text-anchor: middle;
    dominant-baseline: middle;
    pointer-events: none;
    letter-spacing: 0.04em;
  }

  .tri-minor polygon {
    fill: rgba(0, 229, 255, 0.03);
    stroke: var(--line);
    stroke-width: 1.2;
    transition: fill 0.2s, stroke-width 0.2s;
  }
  .tri-minor:hover polygon {
    fill: rgba(0, 229, 255, 0.16);
    stroke-width: 1.9;
    filter: drop-shadow(0 0 8px var(--line));
  }
  /* Drillable (has children) — subtle dotted outline */
  .tri-minor.has-children polygon {
    stroke-dasharray: 5 3;
  }
  .tri-minor text {
    fill: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    text-anchor: middle;
    dominant-baseline: middle;
    pointer-events: none;
    letter-spacing: 0.02em;
  }

  /* --- Floor nav --- */
  #floor-nav {
    position: absolute;
    right: 24px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.7rem;
    z-index: 30;
    pointer-events: none;
  }
  #floor-nav button {
    pointer-events: auto;
    background: rgba(8, 18, 28, 0.85);
    border: 1px solid var(--line-dim);
    color: var(--line);
    font-family: inherit;
    font-size: 0.65rem;
    letter-spacing: 0.14em;
    padding: 0.55rem 0.85rem;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.2s;
    min-width: 44px;
  }
  #floor-nav button:hover:not(:disabled) {
    background: rgba(0, 229, 255, 0.12);
    border-color: var(--line);
    color: var(--accent);
  }
  #floor-nav button:disabled {
    opacity: 0.25;
    cursor: default;
  }
  #floor-indicator {
    pointer-events: auto;
    font-size: 0.6rem;
    letter-spacing: 0.18em;
    color: var(--accent);
    text-transform: uppercase;
    text-align: center;
    padding: 0.4rem 0;
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    user-select: none;
  }

  /* --- Text panel --- */
  #text-panel {
    width: 0;
    height: 100%;
    background: var(--panel-bg);
    border-left: 0 solid var(--panel-border);
    transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1),
                border-left-width 0.4s;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
    z-index: 40;
  }
  #text-panel.open {
    width: min(46vw, 620px);
    border-left-width: 1px;
  }

  #text-panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1rem 1.2rem;
    border-bottom: 1px solid var(--panel-border);
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    gap: 1rem;
    flex-shrink: 0;
  }
  #text-panel-header .actions {
    display: flex;
    gap: 0.5rem;
    align-items: center;
  }
  #text-panel-header a.src-link,
  #text-panel-header .close-btn {
    background: none;
    border: 1px solid var(--line-dim);
    color: var(--line);
    font-family: inherit;
    font-size: 0.6rem;
    padding: 0.3rem 0.7rem;
    cursor: pointer;
    letter-spacing: 0.12em;
    text-decoration: none;
    text-transform: uppercase;
    white-space: nowrap;
  }
  #text-panel-header a.src-link:hover,
  #text-panel-header .close-btn:hover {
    background: rgba(0, 229, 255, 0.08);
  }

  #text-iframe {
    flex: 1;
    width: 100%;
    border: none;
    background: #0b141c;
  }

  #text-fallback {
    flex: 1;
    padding: 2rem;
    font-size: 0.8rem;
    line-height: 1.8;
    color: #b8d8e8;
    overflow-y: auto;
  }
  #text-fallback .warning {
    color: var(--accent);
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 1.2rem;
  }
  #text-fallback code {
    color: var(--line);
    background: rgba(0, 229, 255, 0.06);
    padding: 0.1rem 0.4rem;
    border-radius: 2px;
    font-size: 0.75rem;
  }
  #text-fallback a {
    color: var(--accent);
    border-bottom: 1px dotted var(--accent);
    text-decoration: none;
  }
  .hidden { display: none !important; }

  /* --- Status / breadcrumb --- */
  #floor-breadcrumb {
    position: absolute;
    top: 22px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.68rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--line-dim);
    z-index: 10;
    white-space: nowrap;
    pointer-events: none;
  }
  #floor-breadcrumb span {
    color: var(--accent);
  }

  #status-line {
    position: absolute;
    bottom: 20px;
    left: 20px;
    font-size: 0.6rem;
    letter-spacing: 0.14em;
    color: var(--line-dim);
    text-transform: uppercase;
    pointer-events: none;
    z-index: 10;
  }
  #status-line .accent { color: var(--accent); }

  @media (max-width: 900px) {
    #text-panel.open { width: 100vw; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage-wrap">
    <div id="floor-breadcrumb"></div>
    <div id="stage"></div>
    <div id="floor-nav">
      <button id="floor-up" title="Up one floor (↑)">▲</button>
      <div id="floor-indicator">1 / 4</div>
      <button id="floor-down" title="Down one floor (↓)">▼</button>
    </div>
    <div id="status-line">
      TRIADIC NAVIGATOR // <span class="accent">ENCYCLOPEDIA</span> // 1830
    </div>
  </div>

  <aside id="text-panel">
    <div id="text-panel-header">
      <span id="panel-title">TEXT</span>
      <div class="actions">
        <a id="src-link" class="src-link" href="#" target="_blank" rel="noopener">SOURCE ↗</a>
        <button class="close-btn" id="close-panel">CLOSE</button>
      </div>
    </div>
    <iframe id="text-iframe" title="Hegel text"></iframe>
    <div id="text-fallback" class="hidden"></div>
  </aside>
</div>

function trianglePoints(cx, cy, size, orientation) {
  const h = size * Math.sqrt(3) / 2;
  if (orientation === 'down') {
    return `${cx},${cy + h * 2/3} ${cx - size/2},${cy - h/3} ${cx + size/2},${cy - h/3}`;
  } else {
    return `${cx},${cy - h * 2/3} ${cx - size/2},${cy + h/3} ${cx + size/2},${cy + h/3}`;
  }
}

function truncate(s, n) {
  if (!s) return '';
  return s.length > n ? s.slice(0, n - 1) + '…' : s;
}

function isLeaf(node) {
  return !node.children || node.children.length === 0;
}

function toLocalPath(remoteUrl) {
  if (!remoteUrl) return null;
  const m = remoteUrl.match(/\/archive\/hegel\/(.+?)(#.*)?$/);
  if (!m) return null;
  return LOCAL_DIR + m[1].replace(/\//g, '_') + (m[2] || '');
}

/* ============================================================
   6. FLOOR COMPUTATION
   ============================================================ */
function computeFloors(root) {
  const byDepth = {};
  function walk(node, depth) {
    node.__depth = depth;
    if (isLeaf(node)) return;
    if (!byDepth[depth]) byDepth[depth] = [];
    byDepth[depth].push(node);
    node.children.forEach(c => walk(c, depth + 1));
  }
  walk(root, 0);
  const maxDepth = Math.max(...Object.keys(byDepth).map(Number));
  const out = [];
  for (let d = 0; d <= maxDepth; d++) {
    if (byDepth[d] && byDepth[d].length) out.push(byDepth[d]);
  }
  return out;
}

/* ============================================================
   7. SVG FLOOR BUILD
   ============================================================ */
const UNIT_W = 250;
const UNIT_H = 250;
const GAP_X = 40;
const GAP_Y = 40;
const MAX_PER_ROW = 3;

function buildFloorSvg(triads) {
  const n = triads.length;
  const rows = Math.ceil(n / MAX_PER_ROW);
  const perRowActual = Math.min(MAX_PER_ROW, n);
  const width = perRowActual * UNIT_W + (perRowActual - 1) * GAP_X;
  const height = rows * UNIT_H + (rows - 1) * GAP_Y;

  const svg = document.createElementNS(SVGNS, 'svg');
  svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
  svg.setAttribute('width', width);
  svg.setAttribute('height', height);
  svg.style.display = 'block';

  triads.forEach((node, i) => {
    const row = Math.floor(i / MAX_PER_ROW);
    const col = i % MAX_PER_ROW;
    const inRow = Math.min(MAX_PER_ROW, n - row * MAX_PER_ROW);
    const rowWidth = inRow * UNIT_W + (inRow - 1) * GAP_X;
    const startX = (width - rowWidth) / 2;
    const cx = startX + col * (UNIT_W + GAP_X) + UNIT_W / 2;
    const cy = row * (UNIT_H + GAP_Y) + UNIT_H / 2;
    buildTriadUnit(svg, node, cx, cy);
  });

  return { svg, width, height };
}

function buildTriadUnit(svg, node, cx, cy) {
  // Major (points down)
  const majorG = document.createElementNS(SVGNS, 'g');
  majorG.setAttribute('class', 'tri-major');
  const majorPts = trianglePoints(cx, cy + 10, 130, 'down');
  majorG.innerHTML =
    `<polygon points="${majorPts}" />` +
    `<text x="${cx}" y="${cy + 10}">${truncate(node.shortLabel || node.label, 16)}</text>`;
  majorG.addEventListener('click', (e) => {
    e.stopPropagation();
    if (node.textUrl) openText(node);
  });
  svg.appendChild(majorG);

  // Minors
  const minors = node.children || [];
  const positions = [
    { x: cx, y: cy - 80 },
    { x: cx - 70, y: cy + 60 },
    { x: cx + 70, y: cy + 60 }
  ];
  minors.forEach((child, i) => {
    const pos = positions[i];
    if (!pos) return;
    const pts = trianglePoints(pos.x, pos.y, 90, 'up');
    const g = document.createElementNS(SVGNS, 'g');
    g.setAttribute('class', 'tri-minor' + (isLeaf(child) ? '' : ' has-children'));
    g.innerHTML =
      `<polygon points="${pts}" />` +
      `<text x="${pos.x}" y="${pos.y}">${truncate(child.shortLabel || child.label, 12)}</text>`;
    g.addEventListener('click', (e) => {
      e.stopPropagation();
      onMinorClick(child, node);
    });
    svg.appendChild(g);
  });
}

/* ============================================================
   8. LAYOUT
   ============================================================ */
function layoutFloors() {
  const rect = stage.getBoundingClientRect();
  const vw = rect.width;
  const vh = rect.height;
  if (vw === 0 || vh === 0) return;

  // Fit widest floor to 85% viewport
  const widest = Math.max(...floors.map(f => f.width));
  const baseScale = Math.min(1, (vw * 0.85) / widest);

  const activeH = floors[activeFloorIdx].height * baseScale;
  const activeCY = vh / 2;

  const positions = new Array(floors.length);
  positions[activeFloorIdx] = {
    cy: activeCY, scale: baseScale, opacity: 1, blur: 0
  };

  // Above
  let edgeY = activeCY - activeH / 2;
  for (let i = activeFloorIdx - 1; i >= 0; i--) {
    const dist = activeFloorIdx - i;
    const scale = baseScale * Math.max(0.35, 1 - dist * 0.22);
    const h = floors[i].height * scale;
    const cy = edgeY - 40 - h / 2;
    positions[i] = {
      cy, scale,
      opacity: Math.max(0.18, 0.65 - dist * 0.16),
      blur: Math.min(4, dist * 1.5)
    };
    edgeY = cy - h / 2;
  }

  // Below
  edgeY = activeCY + activeH / 2;
  for (let i = activeFloorIdx + 1; i < floors.length; i++) {
    const dist = i - activeFloorIdx;
    const scale = baseScale * Math.max(0.35, 1 - dist * 0.22);
    const h = floors[i].height * scale;
    const cy = edgeY + 40 + h / 2;
    positions[i] = {
      cy, scale,
      opacity: Math.max(0.18, 0.65 - dist * 0.16),
      blur: Math.min(4, dist * 1.5)
    };
    edgeY = cy + h / 2;
  }

  // Apply
  floors.forEach((floor, i) => {
    const p = positions[i];
    const x = (vw - floor.width) / 2;
    const y = p.cy - floor.height / 2;
    floor.el.style.transform = `translate(${x}px, ${y}px) scale(${p.scale})`;
    floor.el.style.opacity = p.opacity;
    floor.el.style.filter = p.blur > 0 ? `blur(${p.blur}px)` : 'none';
    floor.el.style.pointerEvents = 'auto';
    floor.el.classList.toggle('inactive', i !== activeFloorIdx);
  });

  // Indicator
  floorIndicator.textContent = `FLOOR ${activeFloorIdx + 1} / ${floors.length}`;
  floorUpBtn.disabled = activeFloorIdx === 0;
  floorDownBtn.disabled = activeFloorIdx === floors.length - 1;

  // Breadcrumb
  const triadCount = floors[activeFloorIdx].length;
  breadcrumb.innerHTML = `LAYER <span>${activeFloorIdx + 1}</span> · ${triadCount} TRIAD${triadCount === 1 ? '' : 'S'}`;
}

/* ============================================================
   9. NAVIGATION
   ============================================================ */
function setActiveFloor(idx) {
  if (idx < 0 || idx >= floors.length) return;
  activeFloorIdx = idx;
  layoutFloors();
}

function onMinorClick(child, parent) {
  if (isLeaf(child)) {
    openText(child);
    return;
  }
  // Drill down to the floor that contains this child's triad
  const target = child.__depth;
  if (target >= 0 && target < floors.length) {
    setActiveFloor(target);
  }
}

/* ============================================================
   10. TEXT PANEL
   ============================================================ */
async function openText(node) {
  panelTitle.textContent = node.shortLabel || node.label;
  panel.classList.add('open');
  srcLink.href = node.textUrl || '#';

  // Wait for the panel to expand so stage resizes trigger layout
  requestAnimationFrame(() => layoutFloors());

  const localUrl = toLocalPath(node.textUrl);
  if (!localUrl) {
    showFallback(node, 'This node has no text URL.');
    return;
  }
  const [path, hash] = localUrl.split('#');
  pendingAnchor = hash || null;

  let ok = false;
  try {
    const res = await fetch(path, { method: 'HEAD', cache: 'no-cache' });
    ok = res.ok;
  } catch { ok = false; }

  if (!ok) {
    showFallback(node, `Local file not found: <code>${path}</code>`);
    return;
  }

  hideFallback();
  iframe.src = path;
}

function showFallback(node, reason) {
  iframe.classList.add('hidden');
  iframe.src = 'about:blank';
  fallback.classList.remove('hidden');
  fallback.innerHTML = `
    <div class="warning">Local text unavailable</div>
    <p>${reason}</p>
    <p>Check that <code>hegel_works/</code> sits beside <code>index.html</code>
    and the file name matches the URL convention (slashes → underscores,
    e.g. <code>works/na/nature2.htm</code> → <code>works_na_nature2.htm</code>).</p>
    <p>You can read this passage on Marxists.org:
    <br><a href="${node.textUrl}" target="_blank" rel="noopener">Open "${node.label}" ↗</a></p>`;
}

function hideFallback() {
  fallback.classList.add('hidden');
  iframe.classList.remove('hidden');
}

iframe.addEventListener('load', () => {
  const src = iframe.src || '';
  if (!src || src === 'about:blank') return;
  try {
    const doc = iframe.contentDocument;
    if (!doc || !doc.head || !doc.body) return;
    const style = doc.createElement('style');
    style.textContent = `
      html, body { background: #0b141c !important; color: #b8d8e8 !important; }
      body {
        font-family: 'JetBrains Mono', ui-monospace, monospace !important;
        font-size: 13px !important; line-height: 1.75 !important;
        padding: 22px 28px !important; margin: 0 !important;
      }
      a { color: #00e5ff !important; text-decoration: none !important;
          border-bottom: 1px dotted #007a8a !important; }
      a:hover { color: #ffb300 !important; }
      h1, h2, h3, h4, h5 { color: #ffb300 !important; letter-spacing: 0.05em !important; }
      p { margin: 0.8em 0 !important; }
      center { text-align: left !important; }
      hr { border: none !important; border-top: 1px solid #00e5ff33 !important; }
      img { max-width: 100% !important; height: auto !important; }
    `;
    doc.head.appendChild(style);
    if (pendingAnchor) {
      const t = doc.getElementById(pendingAnchor) ||
                doc.querySelector(`a[name="${pendingAnchor}"]`);
      if (t) t.scrollIntoView({ block: 'start' });
      pendingAnchor = null;
    }
  } catch {}
});

closeBtn.addEventListener('click', () => {
  panel.classList.remove('open');
  iframe.src = 'about:blank';
  hideFallback();
  requestAnimationFrame(() => layoutFloors());
});

/* ============================================================
   11. EVENTS
   ============================================================ */
floorUpBtn.addEventListener('click', () => setActiveFloor(activeFloorIdx - 1));
floorDownBtn.addEventListener('click', () => setActiveFloor(activeFloorIdx + 1));

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowUp') { e.preventDefault(); setActiveFloor(activeFloorIdx - 1); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); setActiveFloor(activeFloorIdx + 1); }
  else if (e.key === 'Escape') closeBtn.click();
});

// Click on an inactive floor -> make it active
stage.addEventListener('click', (e) => {
  const floorEl = e.target.closest('.floor');
  if (!floorEl) return;
  const idx = parseInt(floorEl.dataset.floorIdx, 10);
  if (!isNaN(idx) && idx !== activeFloorIdx) {
    setActiveFloor(idx);
  }
});

// Resize handling
new ResizeObserver(() => layoutFloors()).observe(stageWrap);

/* ============================================================
   12. BOOT
   ============================================================ */
function buildAll() {
  floors = computeFloors(TREE).map((triads, i) => {
    const { svg, width, height } = buildFloorSvg(triads);
    const el = document.createElement('div');
    el.className = 'floor';
    el.dataset.floorIdx = i;
    el.style.width = width + 'px';
    el.style.height = height + 'px';
    el.appendChild(svg);
    stage.appendChild(el);
    return { triads, width, height, el, svg };
  });

  activeFloorIdx = Math.min(INITIAL_FLOOR, floors.length - 1);
  layoutFloors();
}

buildAll();
</script>
