    font-size: 0.65rem; letter-spacing: 0.18em;
    color: var(--accent); text-transform: uppercase;
  }

  #nav-buttons {

    display: flex; flex-direction: column; gap: 0.6rem;
    pointer-events: auto;
  }
  #nav-buttons button {
    background: rgba(8, 18, 28, 0.85);

    color: var(--line);
    font-family: inherit; font-size: 1rem;
    padding: 0.7rem 1rem; cursor: pointer;

    background: rgba(0, 229, 255, 0.12);

    font-size: 0.6rem; letter-spacing: 0.14em;
    color: var(--line-dim); text-transform: uppercase;
  }

    position: absolute; width: 42px; height: 42px;
    border-color: var(--line-dim); border-style: solid;
    pointer-events: none; z-index: 5;
  }
  .corner.tl { top: 16px; left: 16px; border-width: 1px 0 0 1px; }
  .corner.tr { top: 16px; right: 16px; border-width: 1px 1px 0 0; }
  .corner.bl { bottom: 16px; left: 16px; border-width: 0 0 1px 1px; }
  .corner.br { bottom: 16px; right: 16px; border-width: 0 1px 1px 0; }

  #text-panel {
    position: absolute; top: 0; right: 0;
    width: 0; height: 100%;
    background: var(--panel-bg);
    border-left: 0 solid var(--panel-border);
    transition: width 0.4s cubic-bezier(0.22,1,0.36,1),

    display: flex; flex-direction: column; overflow: hidden;
    z-index: 20;
  }
  #text-panel.open { width: min(46vw, 620px); border-left-width: 1px; }

  #panel-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 1rem 1.2rem;
    border-bottom: 1px solid var(--panel-border);
    font-size: 0.7rem; letter-spacing: 0.12em;

/* ============================================================
   2. CONFIG
   ============================================================ */
const FLOOR_HEIGHT = 180;
const GRID_SPACING = 130;
const MAJOR_R      = 25;
const MINOR_R      = 17;
const MINOR_DIST   = 45;
const LOCAL_DIR    = "hegel_works/";

const CAM_OFFSET   = new THREE.Vector3(0, 130, 100);

/* ============================================================
   3. SCENE
   ============================================================ */
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x060a0f, 1);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x060a0f);
scene.fog = new THREE.Fog(0x060a0f, 1000, 3600);

const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 6000);

/* ============================================================
   4. FLOOR COMPUTATION (root excluded; deepest floor → bottom)
   ============================================================ */
const floors = [];
const nodeToGroup = {};
const parentOf = {};

function collectFloors(node, depth) {
  if (!node.children || node.children.length === 0) return;
  // The root (depth 0) is not rendered as a floor — the overview
  // camera acts as its position. Floors 1, 2, 3, ... are rendered.
  if (depth > 0) {
    if (!floors[depth]) {
      floors[depth] = {
        index: depth, nodes: [], groups: [],
        y: 0, targetOpacity: 1, opacity: 1
      };
    }
    floors[depth].nodes.push(node);
  }
  node.children.forEach(c => {
    parentOf[c.id] = node;
    collectFloors(c, depth + 1);
  });
}
collectFloors(TREE, 0);

// Reverse Y: deepest depth sits at y=0 (ground floor);
// shallowest depth sits at the top.
const maxDepth = floors.filter(Boolean).reduce((m, f) => Math.max(m, f.index), 0);
floors.forEach(f => {
  if (!f) return;
  f.y = (maxDepth - f.index) * FLOOR_HEIGHT;
});

/* ============================================================
   5. GRID LAYOUT
   ============================================================ */
function layoutFloor(nodes) {
  const n = nodes.length;
  const cols = Math.min(3, n);
  const rows = Math.ceil(n / cols);
  const out = [];
  for (let i = 0; i < n; i++) {
    const row = Math.floor(i / cols);
    const col = i % cols;
    const inRow = Math.min(cols, n - row * cols);
    const rowWidth = (inRow - 1) * GRID_SPACING;
    const x = col * GRID_SPACING - rowWidth / 2;
    const z = row * GRID_SPACING - (rows - 1) * GRID_SPACING / 2;
    out.push({ x, z });
  }
  return out;
}

/* ============================================================
   6. TRIANGLE GEOMETRY
   ============================================================ */
function triangleGeometry(R, orientation) {
  const shape = new THREE.Shape();
  shape.moveTo(0, R);
  shape.lineTo(-R * Math.sqrt(3) / 2, -R / 2);
  shape.lineTo( R * Math.sqrt(3) / 2, -R / 2);
  shape.closePath();
  const geo = new THREE.ShapeGeometry(shape);
  geo.rotateX(-Math.PI / 2);
  if (orientation === 'down') geo.rotateY(Math.PI);
  return geo;
}

function makeTriangle(R, fillColor, strokeColor, fillOpacity, strokeOpacity, orientation) {
  const geo = triangleGeometry(R, orientation);
  const fillMat = new THREE.MeshBasicMaterial({
    color: fillColor, transparent: true, opacity: fillOpacity,
    side: THREE.DoubleSide, depthWrite: false
  });
  const fill = new THREE.Mesh(geo, fillMat);
  const edges = new THREE.EdgesGeometry(geo);
  const lineMat = new THREE.LineBasicMaterial({
    color: strokeColor, transparent: true, opacity: strokeOpacity,
    depthWrite: false
  });
  const line = new THREE.LineSegments(edges, lineMat);
  const group = new THREE.Group();
  group.add(fill, line);
  return { group, fill, line, fillMat, lineMat };
}

    transform: translate(-50%, -50%);
    pointer-events: none;
    white-space: nowrap;
    text-shadow: 0 0 8px rgba(0,0,0,0.95), 0 0 3px rgba(0,0,0,1);
    will-change: transform, opacity;
  `;
  labelsOverlay.appendChild(el);
  labels.push({ el, worldPos: worldPos.clone(), floorIdx });
}

/* ============================================================
   8. BUILD FLOORS
   ============================================================ */
const clickableFills = [];
const linkLines = [];

function buildTriangleGroup(node, floorIdx) {
  const group = new THREE.Group();
  group.userData = { kind: 'group', node, floorIdx };

  const major = makeTriangle(MAJOR_R, 0xffb300, 0xffb300, 0.10, 0.9, 'down');
  major.fill.userData = { kind: 'major', node, floorIdx };
  clickableFills.push(major.fill);
  group.add(major.group);

  const minorPos = [
    { x: 0,                  z: -MINOR_DIST },
    { x: -MINOR_DIST * 0.87, z:  MINOR_DIST * 0.5 },
    { x:  MINOR_DIST * 0.87, z:  MINOR_DIST * 0.5 }
  ];

  const minors = node.children || [];
  const minorRefs = [];
  minors.forEach((child, i) => {
    const pos = minorPos[i];
    if (!pos) return;
    const minor = makeTriangle(MINOR_R, 0x00e5ff, 0x00e5ff, 0.06, 0.85, 'up');
    minor.group.position.set(pos.x, 0.02, pos.z);
    minor.fill.userData = { kind: 'minor', node: child, floorIdx };
    clickableFills.push(minor.fill);
    group.add(minor.group);
    minorRefs.push({ mesh: minor, child, pos });
  });

  return { group, major, minors: minorRefs, node, floorIdx };
}

function buildAll() {
  floors.forEach((floor, floorIdx) => {
    if (!floor || !floor.nodes.length) return;
    const positions = layoutFloor(floor.nodes);

    floor.nodes.forEach((node, i) => {
      const pos = positions[i];
      const tg = buildTriangleGroup(node, floorIdx);
      tg.group.position.set(pos.x, floor.y, pos.z);
      scene.add(tg.group);
      floor.groups.push(tg);

      const center = new THREE.Vector3(pos.x, floor.y, pos.z);
      nodeToGroup[node.id] = {
        group: tg.group, node, floorIdx, center, x: pos.x, z: pos.z
      };

      addLabel(
        node.shortLabel || node.label,
        new THREE.Vector3(pos.x, floor.y + 4, pos.z),
        '#ffb300', '0.72rem', 600, floorIdx
      );

      tg.minors.forEach(m => {
        addLabel(
          m.child.shortLabel || m.child.label,
          new THREE.Vector3(pos.x + m.pos.x, floor.y + 4, pos.z + m.pos.z),
          '#c8e6f0', '0.58rem', 400, floorIdx
        );
      });
    });
  });
}

function buildLinkLines() {
  for (const nodeId in nodeToGroup) {
    const parent = nodeToGroup[nodeId];
    if (!parent.node.children) continue;

    for (const child of parent.node.children) {
      const childEntry = nodeToGroup[child.id];
      if (!childEntry) continue;   // child has no group (leaf or deeper)
      if (childEntry === parent) continue;

      const mat = new THREE.LineDashedMaterial({
        color: 0x00e5ff,
        dashSize: 5,
        gapSize: 5,
        transparent: true,
        opacity: 0.25,
        depthWrite: false
      });

      const points = [
        new THREE.Vector3(parent.center.x, parent.center.y, parent.center.z),
        new THREE.Vector3(childEntry.center.x, childEntry.center.y, childEntry.center.z)
      ];
      const geo = new THREE.BufferGeometry().setFromPoints(points);
      const line = new THREE.Line(geo, mat);
      line.computeLineDistances();
      line.userData = {
        fromNodeId: parent.node.id,
        toNodeId: childEntry.node.id,
        fromFloor: parent.floorIdx,
        toFloor: childEntry.floorIdx
      };
      scene.add(line);
      linkLines.push(line);
    }
  }
}

/* ============================================================
   9. CAMERA / FOCUS STATE
   ============================================================ */
const camTargetPos  = new THREE.Vector3();
const camTargetLook = new THREE.Vector3();
const camCurLook    = new THREE.Vector3();

let focusedEntry = null;
let inOverview = true;

function focusOn(entry, immediate = false) {
  if (!entry) return;
  inOverview = false;
  focusedEntry = entry;

  camTargetLook.copy(entry.center);
  camTargetPos.copy(entry.center).add(CAM_OFFSET);

  floors.forEach((f, i) => {
    if (!f) return;
    f.targetOpacity = (i === entry.floorIdx) ? 1 : 0.12;
  });

  updateHud();
  if (immediate) {
    camera.position.copy(camTargetPos);
    camCurLook.copy(camTargetLook);
    camera.lookAt(camCurLook);
  }
}

function setOverview(immediate = false) {
  inOverview = true;
  focusedEntry = null;

  const valid = floors.filter(Boolean);
  const highestY = valid.reduce((m, f) => Math.max(m, f.y), 0);
  const stackHeight = highestY;

  camTargetLook.set(0, stackHeight / 2, 0);
  camTargetPos.set(0, stackHeight + 500, 550);

  valid.forEach(f => { f.targetOpacity = 1; });

  updateHud();
  if (immediate) {
    camera.position.copy(camTargetPos);
    camCurLook.copy(camTargetLook);
    camera.lookAt(camCurLook);
  }
}

/* ============================================================
   10. NAVIGATION
   ============================================================ */
function goUp() {
  if (inOverview || !focusedEntry) return;
  const parent = parentOf[focusedEntry.node.id];
  if (parent && nodeToGroup[parent.id]) {
    focusOn(nodeToGroup[parent.id]);
  } else {
    // No parent floor above — return to the overview.
    setOverview();
  }
}

function goDown() {
  if (inOverview || !focusedEntry) {
    // From overview, jump to the topmost rendered floor's first group.
    const top = floors.filter(Boolean).slice().sort((a, b) => b.y - a.y)[0];
    if (top && top.nodes[0]) {
      const entry = nodeToGroup[top.nodes[0].id];
      if (entry) focusOn(entry);
    }
    return;
  }
  const node = focusedEntry.node;
  if (!node.children) return;
  const c = node.children.find(c => c.children && c.children.length);
  if (c) focusOn(nodeToGroup[c.id]);
}

function handleTriangleClick(mesh) {
  const d = mesh.userData;
  if (d.kind === 'major') {
    const entry = nodeToGroup[d.node.id];
    if (entry) {
      focusOn(entry);
      if (d.node.textUrl) openText(d.node);
    }
  } else if (d.kind === 'minor') {
    const child = d.node;
    const hasChildren = child.children && child.children.length > 0;
    if (hasChildren) {
      const entry = nodeToGroup[child.id];
      if (entry) focusOn(entry);
    } else if (child.textUrl) {
      openText(child);
    }
  }
}

/* ============================================================
   11. TEXT PANEL
   ============================================================ */
const panel         = document.getElementById('text-panel');
const panelTitle    = document.getElementById('panel-title');
const iframe        = document.getElementById('text-iframe');
const textFallback  = document.getElementById('text-fallback');
const srcLink       = document.getElementById('src-link');
const closeBtn      = document.getElementById('close-panel');
let pendingAnchor   = null;

function toLocalPath(url) {
  if (!url) return null;
  const m = url.match(/\/archive\/hegel\/(.+?)(#.*)?$/);
  if (!m) return null;
  return LOCAL_DIR + m[1].replace(/\//g, '_') + (m[2] || '');
}

async function openText(node) {
  panelTitle.textContent = node.shortLabel || node.label;
  panel.classList.add('open');
  srcLink.href = node.textUrl || '#';

  const local = toLocalPath(node.textUrl);
  if (!local) { showFallback(node, 'No local URL for this node.'); return; }

  const [path, hash] = local.split('#');
  pendingAnchor = hash || null;

  let ok = false;
  try {
    const res = await fetch(path, { method: 'HEAD', cache: 'no-cache' });
    ok = res.ok;
  } catch { ok = false; }

  if (!ok) { showFallback(node, `Local file not found: <code>${path}</code>`); return; }

  textFallback.classList.add('hidden');
  iframe.classList.remove('hidden');
  iframe.src = path;
}

function showFallback(node, reason) {
  iframe.classList.add('hidden');
  iframe.src = 'about:blank';
  textFallback.classList.remove('hidden');
  textFallback.innerHTML = `
    <div class="warning">Local text unavailable</div>
    <p>${reason}</p>
    <p>Check that <code>hegel_works/</code> sits beside <code>index.html</code>
    and the filename matches the URL convention
    (<code>works/na/nature2.htm</code> → <code>works_na_nature2.htm</code>).</p>
    <p>Read on Marxists.org:
    <br><a href="${node.textUrl}" target="_blank" rel="noopener">Open "${node.label}" ↗</a></p>`;
}

iframe.addEventListener('load', () => {
  const src = iframe.src || '';
  if (!src || src === 'about:blank') return;
  try {
    const doc = iframe.contentDocument;
    if (!doc || !doc.head) return;
    const style = doc.createElement('style');
    style.textContent = `
      html, body { background: #0b141c !important; color: #b8d8e8 !important; }
      body {
        font-family: 'JetBrains Mono', ui-monospace, monospace !important;
        font-size: 13px !important; line-height: 1.75 !important;
        padding: 22px 28px !important; margin: 0 !important;
      }
      a { color: #00e5ff !important; text-decoration: none !important;
          border-bottom: 1px dotted #007a8a !important; }
      a:hover { color: #ffb300 !important; }
      h1, h2, h3, h4, h5 { color: #ffb300 !important; letter-spacing: 0.05em !important; }
      p { margin: 0.8em 0 !important; }
      center { text-align: left !important; }
      hr { border: none !important; border-top: 1px solid #00e5ff33 !important; }
      img { max-width: 100% !important; height: auto !important; }
    `;
    doc.head.appendChild(style);
    if (pendingAnchor) {
      const t = doc.getElementById(pendingAnchor) ||
                doc.querySelector(`a[name="${pendingAnchor}"]`);
      if (t) t.scrollIntoView({ block: 'start' });
      pendingAnchor = null;
    }
  } catch {}
});

closeBtn.addEventListener('click', () => {
  panel.classList.remove('open');
  iframe.src = 'about:blank';
});

/* ============================================================
   12. HUD
   ============================================================ */
function updateHud() {
  const breadcrumb = document.getElementById('breadcrumb');
  const floorIndicator = document.getElementById('floor-indicator');
  const upBtn = document.getElementById('up-btn');
  const downBtn = document.getElementById('down-btn');

  if (!focusedEntry) {
    breadcrumb.innerHTML = `<span class="current">SYSTEM</span>`;
    floorIndicator.textContent = 'OVERVIEW';
    upBtn.disabled = true;
    const hasTopFloor = floors.filter(Boolean).length > 0;
    downBtn.disabled = !hasTopFloor;
    return;
  }

  const path = [];
  let n = focusedEntry.node;
  while (n) { path.unshift(n); n = parentOf[n.id]; }
  breadcrumb.innerHTML = path
    .map((n, i) => i === path.length - 1
      ? `<span class="current">${n.shortLabel || n.label}</span>`
      : `<span>${n.shortLabel || n.label}</span>`)
    .join(' / ');

  floorIndicator.textContent = `FLOOR ${focusedEntry.floorIdx} / ${maxDepth}`;

  upBtn.disabled = false;
  const hasChild = focusedEntry.node.children?.some(c => c.children?.length);
  downBtn.disabled = !hasChild;
}

/* ============================================================
   13. EVENTS
   ============================================================ */
const raycaster = new THREE.Raycaster();
const pointer   = new THREE.Vector2(-2, -2);
let hoveredFill = null;

canvas.addEventListener('pointermove', (e) => {
  const r = canvas.getBoundingClientRect();
  pointer.x = ((e.clientX - r.left) / r.width)  * 2 - 1;
  pointer.y = -((e.clientY - r.top) / r.height) * 2 + 1;
});

canvas.addEventListener('click', () => {
  if (hoveredFill) handleTriangleClick(hoveredFill);
});

document.getElementById('up-btn').addEventListener('click', goUp);
document.getElementById('down-btn').addEventListener('click', goDown);

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowUp')   { e.preventDefault(); goUp(); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); goDown(); }
  else if (e.key === 'Escape') closeBtn.click();
});

window.addEventListener('resize', onResize);
function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}

/* ============================================================
   14. ANIMATION LOOP
   ============================================================ */
const tempVec = new THREE.Vector3();

function updateLabels() {
  const w = window.innerWidth, h = window.innerHeight;
  for (const L of labels) {
    const floor = floors[L.floorIdx];
    const floorOp = floor ? floor.opacity : 1;

    tempVec.copy(L.worldPos).project(camera);

    if (tempVec.z > 1 || floorOp < 0.03) {
      L.el.style.opacity = '0';
      continue;
    }

    const x = (tempVec.x * 0.5 + 0.5) * w;
    const y = (-tempVec.y * 0.5 + 0.5) * h;

    if (x < -120 || x > w + 120 || y < -60 || y > h + 60) {
      L.el.style.opacity = '0';
      continue;
    }

    L.el.style.opacity = String(floorOp);
    L.el.style.transform = `translate(${x}px, ${y}px) translate(-50%, -50%)`;
  }
}

function updateLinkLines() {
  for (const line of linkLines) {
    const d = line.userData;
    if (inOverview || !focusedEntry) {
      line.material.opacity = 0.22;
      continue;
    }
    const focusId = focusedEntry.node.id;
    const isConnected = d.fromNodeId === focusId || d.toNodeId === focusId;
    const touchesFocusedFloor =
      d.fromFloor === focusedEntry.floorIdx ||
      d.toFloor   === focusedEntry.floorIdx;

    if (isConnected)         line.material.opacity = 0.60;
    else if (touchesFocusedFloor) line.material.opacity = 0.30;
    else                     line.material.opacity = 0.07;
  }
}

let lastTime = performance.now();

function animate() {
  requestAnimationFrame(animate);

  const now = performance.now();
  const dt  = Math.min(0.1, (now - lastTime) / 1000);
  lastTime = now;

  const camLerp = 1 - Math.pow(0.001, dt);
  camera.position.lerp(camTargetPos, camLerp);
  camCurLook.lerp(camTargetLook, camLerp);
  camera.lookAt(camCurLook);

  for (const f of floors) {
    if (!f) continue;
    f.opacity += (f.targetOpacity - f.opacity) * (1 - Math.pow(0.005, dt));
  }
  for (const f of floors) {
    if (!f || !f.groups) continue;
    for (const tg of f.groups) {
      tg.major.fillMat.opacity = 0.10 * f.opacity;
      tg.major.lineMat.opacity = 0.90 * f.opacity;
      for (const m of tg.minors) {
        m.mesh.fillMat.opacity = 0.06 * f.opacity;
        m.mesh.lineMat.opacity = 0.85 * f.opacity;
      }
    }
  }

  updateLinkLines();

  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(clickableFills, false);
  let newHover = null;
  for (const hit of hits) {
    const d = hit.object.userData;
    if (!inOverview && focusedEntry && d.floorIdx !== focusedEntry.floorIdx) continue;
    newHover = hit.object;
    break;
  }

  if (newHover !== hoveredFill) {
    if (hoveredFill) {
      const d = hoveredFill.userData;
      hoveredFill.material.color.setHex(d.kind === 'major' ? 0xffb300 : 0x00e5ff);
      hoveredFill = null;
    }
    hoveredFill = newHover;
    if (hoveredFill) {
      const d = hoveredFill.userData;
      hoveredFill.material.color.setHex(d.kind === 'major' ? 0xffd966 : 0x99f0ff);
    }
    canvas.style.cursor = hoveredFill ? 'pointer' : 'default';
  }
  if (hoveredFill) {
    const d = hoveredFill.userData;
    const f = floors[d.floorIdx];
    hoveredFill.material.opacity = 0.35 * (f ? f.opacity : 1);
  }

  updateLabels();
  renderer.render(scene, camera);
}

/* ============================================================
   15. BOOT
   ============================================================ */
buildAll();
buildLinkLines();
onResize();
setOverview(true);
animate();
</script>
</body>
</html>
