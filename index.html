<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hegel Triadic Navigator</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600&display=swap');

  :root {
    --bg: #060a0f;
    --line: #00e5ff;
    --line-dim: #007a8a;
    --accent: #ffb300;
    --text: #c8e6f0;
    --panel-bg: rgba(8, 18, 28, 0.95);
    --panel-border: #00e5ff44;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at 30% 20%, #0a1a28 0%, var(--bg) 60%);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    overflow: hidden;
  }

  #app {
    display: flex;
    height: 100vh;
    width: 100vw;
    position: relative;
  }

  #canvas-wrap {
    flex: 1;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  #canvas-wrap::before,
  #canvas-wrap::after {
    content: '';
    position: absolute;
    width: 42px;
    height: 42px;
    border-color: var(--line-dim);
    border-style: solid;
    pointer-events: none;
  }
  #canvas-wrap::before {
    top: 16px; left: 16px;
    border-width: 1px 0 0 1px;
  }
  #canvas-wrap::after {
    bottom: 16px; right: 16px;
    border-width: 0 1px 1px 0;
  }

  #breadcrumb {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.7rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--line-dim);
    z-index: 10;
    white-space: nowrap;
  }

  #breadcrumb span { color: var(--accent); }

  #triad-svg {
    width: min(78vw, 720px);
    height: auto;
    overflow: visible;
  }

  .tri { cursor: pointer; }
  .tri polygon {
    fill: rgba(0, 229, 255, 0.03);
    stroke: var(--line-dim);
    stroke-width: 1.2;
    transition: stroke 0.25s, fill 0.25s, stroke-width 0.25s;
  }
  .tri:hover polygon {
    stroke: var(--line);
    fill: rgba(0, 229, 255, 0.09);
    stroke-width: 1.8;
    filter: drop-shadow(0 0 6px var(--line));
  }
  .tri text {
    fill: var(--text);
    font-size: 11px;
    pointer-events: none;
    text-anchor: middle;
    dominant-baseline: middle;
    letter-spacing: 0.04em;
  }
  .tri.central polygon {
    stroke: var(--accent);
    fill: rgba(255, 179, 0, 0.04);
  }
  .tri.central text {
    fill: var(--accent);
    font-size: 9px;
  }
  .tri.central:hover polygon {
    stroke: var(--accent);
    fill: rgba(255, 179, 0, 0.10);
    filter: drop-shadow(0 0 8px var(--accent));
  }

  #text-panel {
    position: absolute;
    top: 0;
    right: 0;
    height: 100%;
    width: min(48vw, 620px);
    background: var(--panel-bg);
    border-left: 1px solid var(--panel-border);
    backdrop-filter: blur(12px);
    transform: translateX(100%);
    transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    display: flex;
    flex-direction: column;
    z-index: 20;
  }
  #text-panel.open { transform: translateX(0); }

  #text-panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1rem 1.2rem;
    border-bottom: 1px solid var(--panel-border);
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    gap: 1rem;
  }

  #text-panel-header .header-actions {
    display: flex;
    gap: 0.5rem;
    align-items: center;
  }

  #text-panel-header a.src-link,
  #text-panel-header .close-btn {
    background: none;
    border: 1px solid var(--line-dim);
    color: var(--line);
    font-family: inherit;
    font-size: 0.6rem;
    padding: 0.3rem 0.7rem;
    cursor: pointer;
    letter-spacing: 0.12em;
    text-decoration: none;
    text-transform: uppercase;
    white-space: nowrap;
  }
  #text-panel-header a.src-link:hover,
  #text-panel-header .close-btn:hover {
    background: rgba(0, 229, 255, 0.08);
  }

  #text-iframe {
    flex: 1;
    width: 100%;
    border: none;
    background: #0b141c;
  }

  #fallback {
    flex: 1;
    padding: 2rem;
    font-size: 0.8rem;
    line-height: 1.8;
    color: #b8d8e8;
    overflow-y: auto;
  }
  #fallback .warning {
    color: var(--accent);
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 1.2rem;
  }
  #fallback code {
    color: var(--line);
    background: rgba(0, 229, 255, 0.06);
    padding: 0.1rem 0.4rem;
    border-radius: 2px;
    font-size: 0.75rem;
  }
  #fallback a {
    color: var(--accent);
    border-bottom: 1px dotted var(--accent);
    text-decoration: none;
  }
  #fallback a:hover { color: var(--line); border-color: var(--line); }

  .hidden { display: none !important; }

  .status-line {
    position: absolute;
    bottom: 18px;
    left: 18px;
    font-size: 0.6rem;
    letter-spacing: 0.14em;
    color: var(--line-dim);
    text-transform: uppercase;
    pointer-events: none;
  }
  .status-line .accent { color: var(--accent); }

  #download-btn {
    position: absolute;
    top: 18px;
    left: 18px;
    background: rgba(0, 229, 255, 0.06);
    border: 1px solid var(--line-dim);
    color: var(--line);
    font-family: inherit;
    font-size: 0.6rem;
    letter-spacing: 0.12em;
    padding: 0.35rem 0.7rem;
    cursor: pointer;
    text-transform: uppercase;
    z-index: 30;
  }
  #download-btn:hover { background: rgba(0, 229, 255, 0.12); }

  @media (max-width: 900px) {
    #text-panel { width: 100vw; }
    #triad-svg { width: 94vw; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="canvas-wrap">
    <button id="download-btn" title="Download triad_tree.json">Download JSON</button>
    <div id="breadcrumb"></div>
    <svg id="triad-svg" viewBox="0 0 600 520"></svg>
    <div class="status-line">
      TRIADIC NAVIGATOR // <span class="accent">ENCYCLOPEDIA</span> // 1830
    </div>
  </div>

  <aside id="text-panel">
    <div id="text-panel-header">
      <span id="panel-title">TEXT</span>
      <div class="header-actions">
        <a id="src-link" class="src-link" href="#" target="_blank" rel="noopener">SOURCE ↗</a>
        <button class="close-btn" id="close-panel">CLOSE</button>
      </div>
    </div>
    <iframe id="text-iframe" title="Hegel text"></iframe>
    <div id="fallback" class="hidden"></div>

/* ============================================================
   2. URL translation: Marxists.org -> local hegel_works/
   ============================================================ */
const LOCAL_DIR = "hegel_works/";

function toLocalPath(remoteUrl) {
  if (!remoteUrl) return null;
  const m = remoteUrl.match(/\/archive\/hegel\/(.+?)(#.*)?$/);
  if (!m) return null;
  const path = m[1];
  const anchor = m[2] || "";
  return LOCAL_DIR + path.replace(/\//g, "_") + anchor;
}

/* ============================================================
   3. Triad rendering
   ============================================================ */

const closeBtn = document.getElementById('close-panel');

let pendingAnchor = null;

const CX = 300, CY = 260;

function trianglePoints(cx, cy, size, orientation = 'up') {
  const h = size * Math.sqrt(3) / 2;
  if (orientation === 'up') {
    return `${cx},${cy - h * 2/3} ${cx - size/2},${cy + h/3} ${cx + size/2},${cy + h/3}`;
  } else {
    return `${cx},${cy + h * 2/3} ${cx - size/2},${cy - h/3} ${cx + size/2},${cy - h/3}`;
  }
}

function render(node) {
  svg.innerHTML = '';
  breadcrumb.innerHTML = pathStack
    .map((n, i) => (i === pathStack.length - 1 ? `<span>${n.label}</span>` : n.label))
    .join(' / ');

  const children = node.children || [];

  if (children.length === 0) {
    const pts = trianglePoints(CX, CY, 320, 'up');
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('class', 'tri central');
    g.innerHTML = `<polygon points="${pts}" /><text x="${CX}" y="${CY + 10}">${node.label}</text>`;
    g.addEventListener('click', () => openText(node));
    svg.appendChild(g);
    return;
  }

  const centralPts = trianglePoints(CX, CY + 30, 260, 'down');
  const centralG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  centralG.setAttribute('class', 'tri central');
  centralG.innerHTML = `<polygon points="${centralPts}" /><text x="${CX}" y="${CY + 30}">${node.label}</text>`;
  centralG.addEventListener('click', () => openText(node));
  svg.appendChild(centralG);

  const positions = [
    { cx: CX, cy: CY - 140, orient: 'up' },
    { cx: CX - 150, cy: CY + 100, orient: 'up' },
    { cx: CX + 150, cy: CY + 100, orient: 'up' }
  ];

  children.forEach((child, i) => {
    const pos = positions[i];
    if (!pos) return;
    const pts = trianglePoints(pos.cx, pos.cy, 170, pos.orient);
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('class', 'tri');
    g.innerHTML = `<polygon points="${pts}" /><text x="${pos.cx}" y="${pos.cy}">${child.shortLabel || child.label}</text>`;

    g.addEventListener('click', () => {
      if (child.children && child.children.length > 0) {
        currentNode = child;
        pathStack.push(child);
        render(currentNode);
      } else {
        openText(child);
      }
    });

    svg.appendChild(g);
  });
}

/* ============================================================
   4. Text panel
   ============================================================ */
async function openText(node) {
  panelTitle.textContent = node.shortLabel || node.label;
  panel.classList.add('open');

  srcLink.href = node.textUrl || '#';

  const localUrl = toLocalPath(node.textUrl);
  if (!localUrl) {
    showFallback(node, "This node has no text URL.");
    return;
  }

  const [path, hash] = localUrl.split('#');
  pendingAnchor = hash || null;

  // Verify the file exists before pointing the iframe at it,
  // so we can show a clean fallback instead of a 404 page.
  let ok = false;
  try {
    const res = await fetch(path, { method: 'HEAD', cache: 'no-cache' });
    ok = res.ok;
  } catch {
    ok = false;
  }

  if (!ok) {
    showFallback(node, `Local file not found: <code>${path}</code>`);
    return;
  }

  hideFallback();
  iframe.src = path;
}

function showFallback(node, reason) {
  iframe.classList.add('hidden');
  iframe.src = 'about:blank';
  fallback.classList.remove('hidden');
  fallback.innerHTML = `
    <div class="warning">Local text unavailable</div>
    <p>${reason}</p>
    <p>If you ran the download script, check that <code>hegel_works/</code> is
    in the same directory as <code>index.html</code> and that the file name
    matches the URL convention (slashes become underscores:
    <code>works/na/nature2.htm</code> → <code>works_na_nature2.htm</code>).</p>
    <p>You can read this passage on Marxists.org instead:
    <br><a href="${node.textUrl}" target="_blank" rel="noopener">
      Open “${node.label}” ↗</a></p>`;
}

function hideFallback() {
  fallback.classList.add('hidden');
  iframe.classList.remove('hidden');
}

/* Inject a dark theme into same-origin iframes so the text matches the HUD */
iframe.addEventListener('load', () => {
  const src = iframe.src || '';
  if (!src || src === 'about:blank') return;

  try {
    const doc = iframe.contentDocument;
    if (!doc || !doc.head || !doc.body) return;

    const style = doc.createElement('style');
    style.textContent = `
      html, body {
        background: #0b141c !important;
        color: #b8d8e8 !important;
      }
      body {
        font-family: 'JetBrains Mono', ui-monospace, monospace !important;
        font-size: 13px !important;
        line-height: 1.75 !important;
        padding: 22px 28px !important;
        margin: 0 !important;
      }
      a {
        color: #00e5ff !important;
        text-decoration: none !important;
        border-bottom: 1px dotted #007a8a !important;
      }
      a:hover { color: #ffb300 !important; }
      h1, h2, h3, h4, h5 {
        color: #ffb300 !important;
        letter-spacing: 0.05em !important;
        font-weight: 600 !important;
      }
      p { margin: 0.8em 0 !important; }
      center { text-align: left !important; }
      hr { border: none !important; border-top: 1px solid #00e5ff33 !important; }
      img { max-width: 100% !important; height: auto !important; }
      table { border-collapse: collapse; }
      td, th { padding: 0.3em 0.6em; border: 1px solid #00e5ff22; }
    `;
    doc.head.appendChild(style);

    // Manual anchor scroll (anchor-in-src is unreliable for iframes)
    if (pendingAnchor) {
      const target =
        doc.getElementById(pendingAnchor) ||
        doc.querySelector(`a[name="${pendingAnchor}"]`);
      if (target) {
        target.scrollIntoView({ block: 'start' });
      }
      pendingAnchor = null;
    }
  } catch {
    // Cross-origin or otherwise unreadable — leave default styling.
  }
});

closeBtn.addEventListener('click', () => {
  panel.classList.remove('open');
  iframe.src = 'about:blank';
  hideFallback();
});

/* ============================================================
   5. Download JSON
   ============================================================ */
document.getElementById('download-btn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(TREE, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'triad_tree.json';
  a.click();
  URL.revokeObjectURL(url);
});

/* ============================================================
   6. Boot
   ============================================================ */
render(TREE);
</script>
