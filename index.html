<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hegel Triadic Navigator</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600&display=swap');

    :root {
      --bg: #060a0f;
      --bg-glow: #0a1420;
      --line: #00e5ff;
      --line-dim: #007a8a;
      --accent: #ffb300;
      --text: #c8e6f0;
      --panel-bg: rgba(8, 18, 28, 0.94);
      --panel-border: #00e5ff44;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 30% 20%, #0a1a28 0%, var(--bg) 60%);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      overflow: hidden;
    }

    #app {
      display: flex;
      height: 100vh;
      width: 100vw;
      position: relative;
    }

    #canvas-wrap {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    #canvas-wrap::before,
    #canvas-wrap::after {
      content: '';
      position: absolute;
      width: 42px;
      height: 42px;
      border-color: var(--line-dim);
      border-style: solid;
      pointer-events: none;
    }
    #canvas-wrap::before { top: 16px; left: 16px; border-width: 1px 0 0 1px; }
    #canvas-wrap::after  { bottom: 16px; right: 16px; border-width: 0 1px 1px 0; }

    #breadcrumb {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--line-dim);
      z-index: 10;
      white-space: nowrap;
    }

    #breadcrumb span { color: var(--accent); }

    #triad-svg {
      width: min(78vw, 720px);
      height: auto;
      overflow: visible;
    }

    .tri { cursor: pointer; transition: filter 0.25s ease, opacity 0.25s ease; }

    .tri polygon {
      fill: rgba(0, 229, 255, 0.03);
      stroke: var(--line-dim);
      stroke-width: 1.2;
      transition: stroke 0.25s, fill 0.25s, stroke-width 0.25s;
    }

    .tri:hover polygon {
      stroke: var(--line);
      fill: rgba(0, 229, 255, 0.09);
      stroke-width: 1.8;
      filter: drop-shadow(0 0 6px var(--line));
    }

    .tri text {
      fill: var(--text);
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      pointer-events: none;
      text-anchor: middle;
      dominant-baseline: middle;
      letter-spacing: 0.04em;
    }

    .tri.central polygon {
      stroke: var(--accent);
      fill: rgba(255, 179, 0, 0.04);
    }

    .tri.central text {
      fill: var(--accent);
      font-size: 9px;
    }

    .tri.central:hover polygon {
      stroke: var(--accent);
      fill: rgba(255, 179, 0, 0.10);
      filter: drop-shadow(0 0 8px var(--accent));
    }

    /* ---------- RIGHT TEXT PANEL ---------- */
    #text-panel {
      position: absolute;
      top: 0;
      right: 0;
      height: 100%;
      width: min(46vw, 560px);
      background: var(--panel-bg);
      border-left: 1px solid var(--panel-border);
      backdrop-filter: blur(12px);
      transform: translateX(100%);
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      display: flex;
      flex-direction: column;
      z-index: 20;
    }

    #text-panel.open { transform: translateX(0); }

    #text-panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.2rem;
      border-bottom: 1px solid var(--panel-border);
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    #text-panel-header .close-btn {
      background: none;
      border: 1px solid var(--line-dim);
      color: var(--line);
      font-family: inherit;
      font-size: 0.65rem;
      padding: 0.3rem 0.7rem;
      cursor: pointer;
      letter-spacing: 0.12em;
    }

    #text-panel-header .close-btn:hover { background: rgba(0, 229, 255, 0.08); }

    #text-content {
      flex: 1;
      overflow-y: auto;
      padding: 1.2rem;
      font-size: 0.82rem;
      line-height: 1.7;
      white-space: pre-wrap;
      color: #d6eef7;
      scrollbar-width: thin;
      scrollbar-color: var(--line-dim) transparent;
    }

    #text-content::-webkit-scrollbar { width: 6px; }
    #text-content::-webkit-scrollbar-thumb {
      background: var(--line-dim);
      border-radius: 3px;
    }

    /* ---------- MISC ---------- */
    .status-line {
      position: absolute;
      bottom: 18px;
      left: 18px;
      font-size: 0.6rem;
      letter-spacing: 0.14em;
      color: var(--line-dim);
      text-transform: uppercase;
      pointer-events: none;
    }

    .status-line .accent { color: var(--accent); }

    @media (max-width: 900px) {
      #text-panel { width: 100vw; }
      #triad-svg { width: 94vw; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="canvas-wrap">
      <div id="breadcrumb"></div>
      <svg id="triad-svg" viewBox="0 0 600 520"></svg>
      <div class="status-line">
        TRIADIC NAVIGATOR // <span class="accent">ENCYCLOPEDIA</span> // 1830
      </div>
    </div>

    <aside id="text-panel">
      <div id="text-panel-header">
        <span id="panel-title">TEXT</span>
        <button class="close-btn" id="close-panel">CLOSE</button>
      </div>
      <div id="text-content"></div>
    </aside>
  </div>

  <script>
    // ---------- GLOBALS ----------
    let CORPUS = null;       // loaded from hegel_corpus.json
    let currentNode = null;
    let pathStack = [];      // breadcrumb stack

    // ---------- DOM ----------
    const svg = document.getElementById('triad-svg');
    const breadcrumb = document.getElementById('breadcrumb');
    const panel = document.getElementById('text-panel');
    const panelTitle = document.getElementById('panel-title');
    const textContent = document.getElementById('text-content');
    const closeBtn = document.getElementById('close-panel');

    // ---------- GEOMETRY ----------
    const CX = 300, CY = 260;

    function trianglePoints(cx, cy, size, orientation = 'up') {
      const h = size * Math.sqrt(3) / 2;
      if (orientation === 'up') {
        return `${cx},${cy - h * 2/3} ${cx - size/2},${cy + h/3} ${cx + size/2},${cy + h/3}`;
      }
      return `${cx},${cy + h * 2/3} ${cx - size/2},${cy - h/3} ${cx + size/2},${cy - h/3}`;
    }

    // ---------- DATA ACCESS ----------
    function getTextForNode(node) {
      if (!CORPUS || !node || !node.textUrl) return null;
      // Exact match first
      if (CORPUS.texts[node.textUrl]) return CORPUS.texts[node.textUrl];
      // Try stripping anchor
      const base = node.textUrl.split('#')[0];
      return CORPUS.texts[base] || null;
    }

    // ---------- RENDER ----------
    function render(node) {
      svg.innerHTML = '';
      breadcrumb.innerHTML = pathStack
        .map((n, i) => (i === pathStack.length - 1 ? `<span>${n.label}</span>` : n.label))
        .join(' / ');

      const children = node.children || [];

      // Leaf view
      if (children.length === 0) {
        const pts = trianglePoints(CX, CY, 320, 'up');
        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        g.setAttribute('class', 'tri central');
        g.innerHTML = `<polygon points="${pts}" /><text x="${CX}" y="${CY + 10}">${node.label}</text>`;
        g.addEventListener('click', () => openText(node));
        svg.appendChild(g);
        return;
      }

      // Central context triangle
      const centralPts = trianglePoints(CX, CY + 30, 260, 'down');
      const centralG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      centralG.setAttribute('class', 'tri central');
      centralG.innerHTML = `<polygon points="${centralPts}" /><text x="${CX}" y="${CY + 30}">${node.label}</text>`;
      if (pathStack.length > 1) centralG.addEventListener('click', goBack);
      svg.appendChild(centralG);

      // Child triangles
      const positions = [
        { cx: CX, cy: CY - 140, orient: 'up' },
        { cx: CX - 150, cy: CY + 100, orient: 'up' },
        { cx: CX + 150, cy: CY + 100, orient: 'up' }
      ];

      children.forEach((child, i) => {
        const pos = positions[i];
        const pts = trianglePoints(pos.cx, pos.cy, 170, pos.orient);
        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        g.setAttribute('class', 'tri');
        g.innerHTML = `<polygon points="${pts}" /><text x="${pos.cx}" y="${pos.cy}">${child.shortLabel || child.label}</text>`;

        g.addEventListener('click', () => {
          if (child.children && child.children.length > 0) {
            currentNode = child;
            pathStack.push(child);
            render(currentNode);
          } else if (child.textUrl) {
            openText(child);
          } else {
            currentNode = child;
            pathStack.push(child);
            render(currentNode);
          }
        });

        svg.appendChild(g);
      });
    }

    function goBack() {
      if (pathStack.length > 1) {
        pathStack.pop();
        currentNode = pathStack[pathStack.length - 1];
        render(currentNode);
      }
    }

    function openText(node) {
      panelTitle.textContent = node.shortLabel || node.label;
      const text = getTextForNode(node);
      textContent.textContent = text || 'No text available for this node.';
      panel.classList.add('open');
      // Scroll to top
      textContent.scrollTop = 0;
    }

    closeBtn.addEventListener('click', () => panel.classList.remove('open'));

    // ---------- BOOTSTRAP ----------
    async function init() {
      try {
        const resp = await fetch('hegel_corpus.json');
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        CORPUS = await resp.json();
        currentNode = CORPUS.tree;
        pathStack = [currentNode];
        render(currentNode);
      } catch (err) {
        console.error('Failed to load corpus:', err);
        svg.innerHTML = `<text x="${CX}" y="${CY}" fill="#ff5555" text-anchor="middle">Failed to load hegel_corpus.json</text>`;
      }
    }

    init();
  </script>
</body>
</html>
