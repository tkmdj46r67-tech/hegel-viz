<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hegel Triadic Navigator</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600&display=swap');

    :root {
      --bg: #060a0f;
      --bg-glow: #0a1420;
      --line: #00e5ff;
      --line-dim: #007a8a;
      --accent: #ffb300;
      --text: #c8e6f0;
      --panel-bg: rgba(8, 18, 28, 0.94);
      --panel-border: #00e5ff44;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 30% 20%, #0a1a28 0%, var(--bg) 60%);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      overflow: hidden;
    }

    #app { display: flex; height: 100vh; width: 100vw; position: relative; }

    /* ---------- CANVAS ---------- */
    #canvas-wrap {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    #canvas-wrap::before, #canvas-wrap::after {
      content: '';
      position: absolute;
      width: 42px; height: 42px;
      border-color: var(--line-dim);
      border-style: solid;
      pointer-events: none;
    }
    #canvas-wrap::before { top: 16px; left: 16px; border-width: 1px 0 0 1px; }
    #canvas-wrap::after  { bottom: 16px; right: 16px; border-width: 0 1px 1px 0; }

    #breadcrumb {
      position: absolute;
      top: 20px; left: 50%;
      transform: translateX(-50%);
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--line-dim);
      z-index: 10;
      white-space: nowrap;
      max-width: 90vw;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #breadcrumb span { color: var(--accent); }

    #triad-svg { width: min(78vw, 720px); height: auto; overflow: visible; }

    .tri { cursor: pointer; transition: filter 0.25s ease, opacity 0.25s ease; }
    .tri polygon {
      fill: rgba(0, 229, 255, 0.03);
      stroke: var(--line-dim);
      stroke-width: 1.2;
      transition: stroke 0.25s, fill 0.25s, stroke-width 0.25s;
    }
    .tri:hover polygon {
      stroke: var(--line);
      fill: rgba(0, 229, 255, 0.09);
      stroke-width: 1.8;
      filter: drop-shadow(0 0 6px var(--line));
    }
    .tri text {
      fill: var(--text);
      font-size: 11px;
      pointer-events: none;
      text-anchor: middle;
      dominant-baseline: middle;
      letter-spacing: 0.04em;
    }
    .tri.central polygon {
      stroke: var(--accent);
      fill: rgba(255, 179, 0, 0.04);
    }
    .tri.central text { fill: var(--accent); font-size: 9px; }
    .tri.central:hover polygon {
      stroke: var(--accent);
      fill: rgba(255, 179, 0, 0.10);
      filter: drop-shadow(0 0 8px var(--accent));
    }

    /* ---------- RIGHT PANEL ---------- */
    #text-panel {
      position: absolute;
      top: 0; right: 0;
      height: 100%;
      width: min(46vw, 560px);
      background: var(--panel-bg);
      border-left: 1px solid var(--panel-border);
      backdrop-filter: blur(12px);
      transform: translateX(100%);
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      display: flex;
      flex-direction: column;
      z-index: 20;
    }
    #text-panel.open { transform: translateX(0); }

    #text-panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.2rem;
      border-bottom: 1px solid var(--panel-border);
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      flex-shrink: 0;
    }
    #text-panel-header .close-btn {
      background: none;
      border: 1px solid var(--line-dim);
      color: var(--line);
      font-family: inherit;
      font-size: 0.65rem;
      padding: 0.3rem 0.7rem;
      cursor: pointer;
      letter-spacing: 0.12em;
    }
    #text-panel-header .close-btn:hover { background: rgba(0, 229, 255, 0.08); }

    /* JSON-rendered body */
    #text-body {
      flex: 1;
      overflow-y: auto;
      padding: 1.2rem 1.4rem 3rem;
      font-size: 0.82rem;
      line-height: 1.65;
      color: #b8d4e0;
    }
    #text-body h1, #text-body h2, #text-body h3 {
      color: var(--accent);
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin: 1.4rem 0 0.6rem;
    }
    #text-body p { margin: 0 0 0.9rem; }
    #text-body a { color: var(--line); }
    #text-body em, #text-body i { color: #dce8ee; }
    #text-body .loading {
      color: var(--line-dim);
      font-size: 0.72rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }
    #text-body .error { color: #ff6b6b; font-size: 0.75rem; }

    /* iframe fallback */
    #text-iframe {
      flex: 1;
      width: 100%;
      border: none;
      background: #0b141c;
      display: none;
    }
    #text-panel.iframe-mode #text-iframe { display: block; }
    #text-panel.iframe-mode #text-body { display: none; }

    /* ---------- MISC ---------- */
    .status-line {
      position: absolute;
      bottom: 18px; left: 18px;
      font-size: 0.6rem;
      letter-spacing: 0.14em;
      color: var(--line-dim);
      text-transform: uppercase;
      pointer-events: none;
    }
    .status-line .accent { color: var(--accent); }

    #boot-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--line-dim);
      z-index: 100;
      transition: opacity 0.4s;
    }
    #boot-overlay.hidden { opacity: 0; pointer-events: none; }
    #boot-overlay .error { color: #ff6b6b; }

    @media (max-width: 900px) {
      #text-panel { width: 100vw; }
      #triad-svg { width: 94vw; }
    }
  </style>
</head>
<body>
  <div id="boot-overlay">Loading triadic structure…</div>

  <div id="app">
    <div id="canvas-wrap">
      <div id="breadcrumb"></div>
      <svg id="triad-svg" viewBox="0 0 600 520"></svg>
      <div class="status-line">
        TRIADIC NAVIGATOR // <span class="accent">ENCYCLOPEDIA</span> // 1830
      </div>
    </div>

    <aside id="text-panel">
      <div id="text-panel-header">
        <span id="panel-title">TEXT</span>
        <button class="close-btn" id="close-panel">CLOSE</button>
      </div>
      <div id="text-body"></div>
      <iframe id="text-iframe" title="Hegel text"></iframe>
    </aside>
  </div>

  <script>
    // ============================================================ config
    const TREE_URL = 'triad_tree.json';

    // ============================================================ state
    let TREE = null;
    let currentNode = null;
    let pathStack = [];

    // ============================================================ dom
    const svg        = document.getElementById('triad-svg');
    const breadcrumb = document.getElementById('breadcrumb');
    const panel      = document.getElementById('text-panel');
    const panelTitle = document.getElementById('panel-title');
    const textBody   = document.getElementById('text-body');
    const iframe     = document.getElementById('text-iframe');
    const closeBtn   = document.getElementById('close-panel');
    const boot       = document.getElementById('boot-overlay');

    // ============================================================ geometry
    const CX = 300, CY = 260;

    function trianglePoints(cx, cy, size, orientation = 'up') {
      const h = size * Math.sqrt(3) / 2;
      if (orientation === 'up') {
        return `${cx},${cy - h * 2/3} ${cx - size/2},${cy + h/3} ${cx + size/2},${cy + h/3}`;
      }
      return `${cx},${cy + h * 2/3} ${cx - size/2},${cy - h/3} ${cx + size/2},${cy - h/3}`;
    }

    // ============================================================ render
    function render(node) {
      svg.innerHTML = '';
      breadcrumb.innerHTML = pathStack
        .map((n, i) => (i === pathStack.length - 1 ? `<span>${n.label}</span>` : n.label))
        .join(' / ');

      const children = node.children || [];

      // Leaf view: one big triangle, clickable if it has text
      if (children.length === 0) {
        const pts = trianglePoints(CX, CY, 320, 'up');
        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        g.setAttribute('class', 'tri central');
        g.innerHTML = `<polygon points="${pts}" /><text x="${CX}" y="${CY + 10}">${node.label}</text>`;
        if (node.textUrl) g.addEventListener('click', () => openText(node));
        svg.appendChild(g);
        return;
      }

      // Centre triangle = current node (click to go back if not root)
      const centralPts = trianglePoints(CX, CY + 30, 260, 'down');
      const centralG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      centralG.setAttribute('class', 'tri central');
      centralG.innerHTML = `<polygon points="${centralPts}" /><text x="${CX}" y="${CY + 30}">${node.label}</text>`;
      if (pathStack.length > 1) centralG.addEventListener('click', goBack);
      // Also allow reading text for the central node if it has one
      if (node.textUrl) {
        // shift-click? No — simpler: clicking centre back-navigates;
        // a node's own text is accessible from its parent's view.
      }
      svg.appendChild(centralG);

      // Three child triangles
      const positions = [
        { cx: CX,       cy: CY - 140, orient: 'up' },
        { cx: CX - 150, cy: CY + 100, orient: 'up' },
        { cx: CX + 150, cy: CY + 100, orient: 'up' }
      ];

      children.slice(0, 3).forEach((child, i) => {
        const pos = positions[i];
        const pts = trianglePoints(pos.cx, pos.cy, 170, pos.orient);
        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        g.setAttribute('class', 'tri');
        g.innerHTML = `<polygon points="${pts}" /><text x="${pos.cx}" y="${pos.cy}">${child.shortLabel || child.label}</text>`;

        g.addEventListener('click', () => {
          if (child.children && child.children.length > 0) {
            currentNode = child;
            pathStack.push(child);
            render(currentNode);
          } else if (child.textUrl) {
            // Leaf with text: open panel, but also drill to leaf view so the
            // user can see context
            currentNode = child;
            pathStack.push(child);
            render(currentNode);
            openText(child);
          } else {
            currentNode = child;
            pathStack.push(child);
            render(currentNode);
          }
        });
        svg.appendChild(g);
      });
    }

    function goBack() {
      if (pathStack.length > 1) {
        pathStack.pop();
        currentNode = pathStack[pathStack.length - 1];
        render(currentNode);
      }
    }

    // ============================================================ text panel
    async function openText(node) {
      panelTitle.textContent = node.shortLabel || node.label;
      panel.classList.add('open');

      const url = node.textUrl;

      // External or local .htm/.html → use iframe (browser handles it)
      if (/^https?:/i.test(url) || /\.html?($|#)/i.test(url)) {
        panel.classList.add('iframe-mode');
        iframe.src = url;
        return;
      }

      // Otherwise: assume JSON. Try to fetch and render.
      panel.classList.remove('iframe-mode');
      iframe.src = 'about:blank';
      textBody.innerHTML = '<div class="loading">Loading text…</div>';

      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        renderTextJSON(data);
      } catch (err) {
        textBody.innerHTML = `<div class="error">Could not load ${url}<br>${err.message}</div>`;
      }
    }

    function renderTextJSON(data) {
      // Accept a few common shapes so you don't have to reshape your corpus:
      //   { html: "..." }
      //   { text: "..." }
      //   { title, text } or { title, html }
      //   { sections: [ {title, text|html}, ... ] }
      //   { paragraphs: ["...", "..."] }
      const pieces = [];

      const escape = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

      const emitBlock = (b) => {
        if (!b) return;
        if (typeof b === 'string') {
          // Plain string: split into paragraphs on blank lines
          b.split(/\n{2,}/).forEach(par => {
            const t = par.trim();
            if (t) pieces.push(`<p>${t.replace(/\n/g, '<br>')}</p>`);
          });
          return;
        }
        if (b.html) { pieces.push(b.html); return; }
        if (b.text) { emitBlock(b.text); return; }
      };

      if (data.title) pieces.push(`<h1>${escape(data.title)}</h1>`);
      if (data.sections) {
        for (const s of data.sections) {
          if (s.title) pieces.push(`<h2>${escape(s.title)}</h2>`);
          emitBlock(s.html ? s : s.text);
        }
      } else if (data.paragraphs) {
        data.paragraphs.forEach(p => emitBlock(p));
      } else {
        emitBlock(data);
      }

      textBody.innerHTML = pieces.join('\n') || '<div class="error">Empty document.</div>';
      textBody.scrollTop = 0;
    }

    closeBtn.addEventListener('click', () => {
      panel.classList.remove('open', 'iframe-mode');
      iframe.src = 'about:blank';
    });

    // ============================================================ boot
    async function boot_() {
      try {
        const res = await fetch(TREE_URL);
        if (!res.ok) throw new Error(`HTTP ${res.status} fetching ${TREE_URL}`);
        TREE = await res.json();

        // Support either a single root or {root: {...}} or an array of roots
        if (Array.isArray(TREE)) {
          TREE = { id: 'root', label: 'System of Science', children: TREE };
        } else if (TREE.root) {
          TREE = TREE.root;
        }

        currentNode = TREE;
        pathStack  = [TREE];
        render(currentNode);
        boot.classList.add('hidden');
      } catch (err) {
        boot.innerHTML = `<span class="error">Failed to load tree: ${err.message}</span>`;
        console.error(err);
      }
    }

    boot_();
  </script>
</body>
</html>
